title: Andhra Potato Kurma (Aloo Kurma)
tags:
  - South Indian
  - Curry
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: large potatoes, peeled & cubed
    amount: 500
    unit: g
  - name: oil
    amount: 30
    unit: g
  - name: onions, finely chopped
    amount: 150
    unit: g
  - name: tomatoes, finely chopped
    amount: 90
    unit: g
  - name: ginger garlic paste
    amount: 1.5
    unit: tsp
  - name: green chillies, slit (optional)
    amount: 2
    unit: ""
  - name: salt (adjust to taste)
    amount: 0.5
    unit: tsp
  - name: turmeric powder — 0.5 g / ¼ tsp
    amount: 0.25
    unit: tsp
  - name: red chilli powder — 2 g / ¾ tsp
    amount: 0.75
    unit: tsp
  - name: garam masala — 3 g / 1¼ tsp
    amount: 1.25
    unit: tsp
  - name: fennel seeds powder (saunf) — 0.5 g / ¼ tsp
    amount: 0.25
    unit: tsp
  - name: fresh mint leaves (pudina), chopped
    amount: 10
    unit: g
  - name: fresh coriander leaves, chopped
    amount: 10
    unit: g
  - name: hot water
    amount: 400
    unit: ml
  - name: fresh/desiccated coconut (grated)
    amount: 30
    unit: g
  - name: poppy seeds (or 8 cashews)
    amount: 16
    unit: g
  - name: shahi jeera (or cumin seeds) — 1.5 g / ½ tsp
    amount: 0.5
    unit: tsp
  - name: green cardamoms
    amount: 2
    unit: ""
  - name: star anise
    amount: 1
    unit: ""
  - name: cinnamon stick (2.5 cm)
    amount: 1
    unit: ""
  - name: cloves
    amount: 4
    unit: ""
  - name: bay leaf (small)
    amount: 1
    unit: ""
  - name: mace (javitri), 1 strand — optional
    amount: 1
    unit: ""
instructions:
  - "Make the coconut paste: Blend fresh/desiccated coconut and poppy seeds with a splash of water into a smooth, thick paste. Set aside. (Alternative: use 120 g / ½ cup thick whisked yogurt instead of the coconut paste.)"
  - "Temper the whole spices: Heat oil in a heavy pan or pressure cooker over medium heat. Reduce to low and add bay leaf, star anise, cloves, cinnamon stick, green cardamoms, mace, and shahi jeera. Let them sizzle for 30 seconds."
  - "Fry the onions: Add onions and increase heat to medium. Sauté, stirring often, until golden brown."
  - "Add ginger garlic & tomatoes: Add ginger garlic paste and fry for 40–60 seconds until the raw smell disappears. Add green chillies if using, then tomatoes, salt, and turmeric powder. Fry until tomatoes are completely soft and mushy."
  - "Add mint & spice powders: Add fresh mint leaves and fry for 1 minute. Then add red chilli powder, garam masala, and fennel seeds powder. Sauté for 2–3 minutes until the raw smell of the chilli powder disappears."
  - "Add coconut paste: Add the coconut-poppy paste and mix well. Fry for 2–3 minutes until the masala smells aromatic and oil begins to separate. (If using yogurt: mix 2 tbsp of the hot masala into the yogurt first, then lower heat and pour slowly into the pan.)"
  - "Add potatoes & water: Add large potatoes and sauté for 2 minutes. Pour hot water (hot) — enough to just cover the potatoes. Bring to a rapid boil, then reduce heat to low, cover, and cook until potatoes are fully tender. Alternatively, pressure cook on low for 1 whistle."
  - "Finish & serve: If gravy is too thin, simmer uncovered on high to reduce. Taste and adjust salt. Garnish with fresh coriander leaves and serve hot with rice, pulao, or chapati."
