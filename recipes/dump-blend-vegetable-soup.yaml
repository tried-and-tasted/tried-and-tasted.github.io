title: Dump & Blend Vegetable Soup
tags:
  - International
  - Soup
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: potato, roughly chopped
    amount: 200
    unit: g
  - name: frozen summer vegetable mix (straight from freezer)
    amount: 150
    unit: g
  - name: frozen peas (straight from freezer)
    amount: 100
    unit: g
  - name: onion, roughly chopped (1.5 onions)
    amount: 150
    unit: g
  - name: tomato, roughly chopped (1.5 tomatoes)
    amount: 150
    unit: g
  - name: capsicum mixed colours, roughly chopped (1.5 capsicum)
    amount: 150
    unit: g
  - name: leek, sliced into rounds
    amount: 100
    unit: g
  - name: garlic cloves, crushed
    amount: 3
    unit: ""
  - name: fresh ginger, grated (optional)
    amount: 8
    unit: g
  - name: water (reduced for frozen vegetables which release extra water)
    amount: 750
    unit: ml
  - name: turmeric
    amount: 0.75
    unit: tsp
  - name: coriander powder
    amount: 0.75
    unit: tsp
  - name: cumin powder
    amount: 0.5
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1.5
    unit: tsp
  - name: bay leaves
    amount: 2
    unit: ""
  - name: ghee — added after blending
    amount: 20
    unit: g
  - name: lemon juice — added after blending
    amount: 15
    unit: ml
instructions:
  - "Rough chop fresh vegetables (3 min): Roughly chop potato, onion, tomato, capsicum mixed colours and leek — no need to be neat, everything gets blended. Crush garlic cloves and grate fresh ginger if using. frozen summer vegetable mix and frozen peas go in straight from the freezer."
  - "Dump everything in — no frying needed: Add everything directly into the pressure cooker in this order — potato, onion, tomato, capsicum mixed colours, leek, frozen summer vegetable mix and frozen peas straight from freezer, garlic cloves, fresh ginger, turmeric, coriander powder, cumin powder, black pepper, salt and bay leaves. Pour water over everything. Stir once to combine. No frying, no oil."
  - "Pressure cook (4 whistles + 5 min low): Close the pressure cooker lid. Cook on high until 4 whistles then reduce to low for 5 minutes. Turn off and let pressure release naturally — about 10 minutes. Do not force open."
  - "Open and check softness: Open lid carefully. Remove bay leaves. Check soup — all vegetables should be completely soft. If anything still feels firm close lid and give 1 more whistle."
  - "Blend with stabmixer (keep head submerged): Insert stabmixer fully into the pot before switching on — keep head submerged at all times to avoid hot splashing. Blend for 90 seconds until completely smooth and velvety. The potato and vegetables create a naturally thick hearty consistency."
  - "Stir in ghee and lemon — then taste: Add ghee directly into hot blended soup and stir vigorously for 10 seconds until fully incorporated — it should emulsify into the soup rather than float on top. Add lemon juice and stir. Taste and adjust salt."
  - "Portion for fridge or freezer: Serve immediately or cool completely before portioning. Fridge: airtight containers 3–4 days. Freezer: individual portions up to 3 months. Add fresh ghee after reheating for best flavour rather than freezing with ghee inside."
