title: Blistered Cherry Tomato Pasta with Melted Gouda
tags:
  - International
  - Pasta & Noodles
  - Vegetarian
servings: 2
ingredients:
  - name: Barilla pipe pasta (rigatoni style)
    amount: 200
    unit: g
  - name: cherry tomatoes, halved
    amount: 250
    unit: g
  - name: young Gouda slices, torn into small pieces
    amount: 3
    unit: g
  - name: onion, finely sliced
    amount: 120
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: olive oil
    amount: 18
    unit: g
  - name: butter
    amount: 15
    unit: g
  - name: salt for pasta water
    amount: 1
    unit: tbsp
  - name: salt for sauce
    amount: 0.5
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: chili flakes (optional)
    amount: 0.5
    unit: tsp
  - name: pasta cooking water (reserve before draining)
    amount: 100
    unit: ml
instructions:
  - "Boil the pasta: Bring a large pot of water to boil. Add salt for pasta water. Cook Barilla pipe pasta according to packet instructions minus 1 minute — it should be firm to bite (al dente). Before draining, scoop out pasta cooking water with a mug and set aside."
  - "Blister the cherry tomatoes (don't touch them): While pasta cooks, heat olive oil in a wide pan on high heat. Add cherry tomatoes cut side down. Do not stir — let them blister and char for 3 minutes undisturbed. You want them slightly blackened at the edges. This is where all the flavour comes from."
  - "Burst and build the sauce: Once tomatoes are blistered, press them gently with a spatula so they burst and release their juices. Add butter, onion and garlic cloves. Reduce heat to medium and cook for 4–5 minutes until onion softens and everything comes together into a rough sauce."
  - "Combine pasta and sauce: Add drained pasta directly into the pan. Add salt for sauce, black pepper and chili flakes if using. Toss everything together. Add pasta water a splash at a time until the sauce coats every piece of pasta glossily — you may not need all of it."
  - "Melt the Gouda in: Turn heat to lowest setting. Scatter torn young Gouda pieces over the pasta and fold in gently. The residual heat melts the Gouda into silky streaks throughout. Do not stir aggressively — you want pockets of melted cheese, not a uniform gloop. Serve immediately."
