title: South Indian Mutton Kuzhambu with Shallots
tags:
  - South Indian
  - Curry
  - Pressure cooker
servings: 2
ingredients:
  - name: Indian mutton (goat), bone-in & boneless mix, ~5cm pieces
    amount: 300
    unit: g
  - name: shallots, peeled & halved or finely chopped
    amount: 85
    unit: g
  - name: tomatoes, chopped
    amount: 100
    unit: g
  - name: ginger-garlic paste (equal parts, ~9g each)
    amount: 18
    unit: g
  - name: frozen fresh coconut, thawed & pat dried — OR
    amount: 24
    unit: g
  - name: fine desiccated coconut (unsweetened)
    amount: 20
    unit: g
  - name: coconut oil
    amount: 17
    unit: g
  - name: mustard seeds
    amount: 0.5
    unit: tsp
  - name: curry leaves
    amount: 5
    unit: g
  - name: dried red chillies
    amount: 2
    unit: piece
  - name: Kashmiri chilli powder
    amount: 1
    unit: tsp
  - name: coriander powder
    amount: 0.5
    unit: tbsp
  - name: cumin powder
    amount: 0.5
    unit: tsp
  - name: turmeric powder
    amount: 0.25
    unit: tsp
  - name: black pepper powder
    amount: 0.5
    unit: tsp
  - name: garam masala
    amount: 0.5
    unit: tsp
  - name: fennel seeds / sombu — optional but authentic
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: water
    amount: 150
    unit: ml
instructions:
  - "Prepare & grind coconut paste: Dry roast the coconut in a small pan on medium heat, stirring constantly. Fine desiccated coconut needs no soaking and turns golden in 30–60 seconds — take it off the heat as soon as it smells nutty, as it burns in seconds. Frozen coconut takes 1–2 minutes. Grind with 20ml water into a smooth paste. Set aside."
  - "Temper spices: Heat coconut oil in your pressure cooker over medium heat. Add mustard seeds and wait for them to pop. Add dried red chillies and curry leaves — stand back as curry leaves splutter. Fry 30 seconds until fragrant."
  - "Fry shallots: Add shallots and fry on medium heat, stirring every minute. Shallots caramelise faster than big onions — watch carefully. Fry for 8–10 minutes until deep golden brown and jammy. Don't rush this step."
  - "Add ginger-garlic & tomatoes: Add ginger-garlic paste and fry for 2 minutes until raw smell disappears completely. Add tomatoes and cook on medium heat, mashing occasionally, until tomatoes fully dissolve and oil separates from the sides — about 5–6 minutes."
  - "Add spice powders: Lower heat. Add Kashmiri chilli powder, coriander powder, cumin powder, turmeric powder, black pepper powder, fennel seeds / sombu and salt. Mix well and fry for 2 minutes until oil rises to the surface and the masala smells deeply fragrant."
  - "Brown the mutton: Increase heat to high. Add Indian mutton and toss well to coat every piece in the masala. Sear for 5–6 minutes, stirring occasionally, until the meat browns all over and the masala clings beautifully."
  - "Pressure cook: Add water — just enough to barely cover the meat. Mix well. Close the lid and pressure cook on medium heat for 5–6 whistles (about 20–25 minutes). Indian goat mutton needs full time — do not reduce whistles. Let pressure release naturally."
  - "Add coconut paste & reduce gravy: Open the cooker once pressure fully drops. Stir in the coconut paste and simmer uncovered on medium heat for 8–10 minutes, stirring occasionally, until the gravy thickens to a rich coating consistency."
  - "Finish with garam masala: Add garam masala, stir and simmer for 1 more minute. Taste and adjust salt. Garnish with fresh curry leaves. Serve hot with rice, idiyappam, or parotta."
