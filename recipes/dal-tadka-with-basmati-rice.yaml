title: Dal Tadka with Basmati Rice
tags:
  - North Indian
  - Curry
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: red lentils
    amount: 250
    unit: g
  - name: basmati rice
    amount: 300
    unit: g
  - name: water for dal
    amount: 750
    unit: ml
  - name: water for rice
    amount: 540
    unit: ml
  - name: onion, finely chopped
    amount: 200
    unit: g
  - name: tomatoes, chopped
    amount: 250
    unit: g
  - name: garlic cloves, minced
    amount: 4
    unit: ""
  - name: fresh ginger, grated (or ½ tsp powder)
    amount: 12
    unit: g
  - name: neutral oil or ghee (for frying)
    amount: 40
    unit: g
  - name: butter or ghee (for tadka)
    amount: 18
    unit: g
  - name: cumin seeds
    amount: 1.5
    unit: tsp
  - name: turmeric powder
    amount: 0.75
    unit: tsp
  - name: coriander powder
    amount: 2
    unit: tsp
  - name: red chili powder (or paprika for mild)
    amount: 0.75
    unit: tsp
  - name: garam masala
    amount: 1
    unit: tsp
  - name: salt
    amount: 1.5
    unit: tsp
  - name: dried kasuri methi / fenugreek leaves (optional)
    amount: 1
    unit: tsp
instructions:
  - "Rinse lentils and rice: Rinse red lentils under cold water until the water runs clear (2–3 times). Do the same for basmati rice separately. This removes starch and improves texture. Soak rice in cold water for 10 minutes while you prep the rest."
  - "Sauté onion base: Heat neutral oil or ghee in the pressure cooker pot on medium-high. Add cumin seeds and let them sizzle for 30 seconds. Add onion and fry for 6–8 minutes until golden brown. Add garlic cloves and fresh ginger, fry for 1–2 minutes until the raw smell disappears."
  - "Add tomatoes and spices: Add tomatoes to the pot. Cook for 4–5 minutes until the tomatoes soften and the oil starts to separate at the edges. Add turmeric powder, coriander powder, red chili powder, and salt. Stir well and cook for 1 more minute."
  - "Pressure cook the dal: Add rinsed red lentils and water for dal to the pot. Stir everything together. Close the pressure cooker lid. Cook on high heat until 3 whistles, then reduce to low for 5 minutes. Turn off and let pressure release naturally."
  - "Cook the rice (parallel): While the dal cooks, drain the soaked basmati rice. In a separate pot, bring water for rice with a pinch of salt to a boil. Add rice, stir once, cover tightly and cook on the lowest heat for 12 minutes. Do not open the lid. Remove from heat and rest 5 minutes."
  - "Make the tadka (tempering): Open the pressure cooker and stir the dal — it should be thick and creamy. In a small pan, melt butter or ghee on medium-high. Add a pinch of cumin seeds and let them pop. Add a pinch of red chili powder and immediately pour this tadka over the dal. Add garam masala and dried kasuri methi / fenugreek leaves if using, stir gently."
  - "Pack and store: Let dal and rice cool slightly before packing into separate airtight containers. The dal thickens as it cools — add a splash of water when reheating. Microwave for 2 minutes to reheat. Dal keeps well for 2 days in the fridge."
