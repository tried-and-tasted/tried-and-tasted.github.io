title: Minestrone Soup
tags:
  - International
  - Soup
servings: 6
ingredients:
  - name: penne or fusilli (cooked fresh per portion when reheating)
    amount: 200
    unit: g
  - name: canned cannellini or kidney beans
    amount: 400
    unit: g
  - name: canned chopped tomatoes or passata
    amount: 400
    unit: g
  - name: zucchini, diced 1.5cm
    amount: 200
    unit: g
  - name: carrots, diced 1.5cm
    amount: 200
    unit: g
  - name: celery, sliced
    amount: 150
    unit: g
  - name: onion, finely diced
    amount: 150
    unit: g
  - name: potato or sweet potato, diced 1.5cm
    amount: 150
    unit: g
  - name: frozen peas or frozen mixed vegetables
    amount: 100
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: vegetable broth (from stock cubes)
    amount: 1200
    unit: ml
  - name: olive oil
    amount: 30
    unit: g
  - name: bay leaves
    amount: 2
    unit: ""
  - name: dried thyme
    amount: 1
    unit: tsp
  - name: dried oregano
    amount: 1
    unit: tsp
  - name: dried basil
    amount: 1
    unit: tsp
  - name: salt
    amount: 1.5
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: Parmesan or Grana Padano rind (optional but transforms the broth)
    amount: 1
    unit: tsp
  - name: lemon juice or white wine vinegar — added at the end
    amount: 15
    unit: ml
instructions:
  - "Prep all vegetables (10 min): Dice zucchini, carrots, celery, onion and potato or sweet potato into similar 1.5cm pieces — uniform size means everything cooks evenly. Drain and rinse canned cannellini or kidney beans under cold water. Open canned chopped tomatoes. Mince garlic cloves."
  - "Build the base (9 min): Heat olive oil in a large pot on medium-high. Add onion and cook for 5 minutes until soft and translucent. Add garlic cloves and stir for 1 minute until fragrant. Add carrots and celery — the harder vegetables — and cook for 3 more minutes."
  - "Add everything and bring to boil: Add canned chopped tomatoes, zucchini, potato or sweet potato, bay leaves, dried thyme, dried oregano, dried basil, salt and black pepper. Stir well. Pour in vegetable broth. Drop in Parmesan rind if using. Bring to a boil."
  - "Simmer (25 min): Reduce heat to medium-low. Cover and simmer for 25 minutes until carrots and potato are completely soft. Stir occasionally."
  - "Add beans, peas and finish: Add canned cannellini or kidney beans and frozen peas or frozen mixed vegetables straight from frozen. Simmer uncovered for 5 more minutes. Remove bay leaves and Parmesan rind. Add lemon juice or white wine vinegar and stir — this brightens the whole pot instantly. Taste and adjust salt."
  - "Portion and store: Let cool completely before portioning. Fridge portions: ladle into airtight containers as is — add cooked pasta when reheating. Freezer portions: ladle into zip-lock bags, lay flat, freeze. Label with the date."
  - "Reheating: From fridge: reheat in microwave 2 min, add splash of water, stir. Boil 30–35g pasta separately, mix in. From frozen: microwave 3–4 min from frozen or thaw overnight. Pasta always cooked fresh — never freeze with pasta inside."
