title: South Indian Chicken Kolambu (Pressure Cooker)
tags:
  - South Indian
  - Curry
  - Pressure cooker
servings: 2
ingredients:
  - name: boneless chicken thigh, cut into chunks
    amount: 350
    unit: g
  - name: coconut oil (or neutral oil)
    amount: 19
    unit: g
  - name: mustard seeds
    amount: 1
    unit: tsp
  - name: dried red chillies
    amount: 2
    unit: piece
  - name: curry leaves
    amount: 15
    unit: piece
  - name: onion, finely chopped
    amount: 105
    unit: g
  - name: garlic, minced
    amount: 15
    unit: g
  - name: ginger, minced
    amount: 10
    unit: g
  - name: tomatoes, chopped
    amount: 140
    unit: g
  - name: water
    amount: 140
    unit: ml
  - name: turmeric powder
    amount: 0.33
    unit: tsp
  - name: red chilli powder
    amount: 0.75
    unit: tsp
  - name: coriander powder
    amount: 1.5
    unit: tsp
  - name: cumin powder
    amount: 0.75
    unit: tsp
  - name: black pepper powder
    amount: 0.33
    unit: tsp
  - name: garam masala
    amount: 0.33
    unit: tsp
  - name: salt
    amount: 0.75
    unit: tsp
  - name: fresh coriander, chopped (garnish)
    amount: 10
    unit: g
instructions:
  - "Marinate the chicken: Toss boneless chicken thigh with turmeric powder, red chilli powder, and half of salt. Set aside."
  - "Temper the spices: Heat coconut oil in the pressure cooker pot on medium-high heat (lid off). Add mustard seeds and wait for them to splutter. Add dried red chillies and curry leaves and fry for 20–30 seconds until fragrant."
  - "Brown the onions: Add onion and fry, stirring frequently, until deep golden brown. Do not rush this — it is the base of the flavour."
  - "Add ginger, garlic & tomatoes: Add garlic and ginger, stir for 1 minute. Add tomatoes and cook until tomatoes break down completely and oil separates from the mixture."
  - "Add ground spices: Lower heat to medium. Add coriander powder, cumin powder, black pepper powder, and remaining salt. Stir well and cook for 2 minutes. Add a splash of water if it sticks to the bottom."
  - "Add chicken: Add the marinated boneless chicken thigh and stir well to coat in the masala. Cook for 3 minutes, turning occasionally, until the chicken is sealed on the outside."
  - "Pressure cook: Pour in water and stir well. Scrape any bits off the bottom of the pot. Close the lid and pressure cook on medium heat until you hear 2 whistles, then turn off the heat."
  - "Natural pressure release: Let the pressure release naturally — do not force open. Wait until all steam is gone before opening the lid."
  - "Reduce gravy if needed: If the gravy looks too thin, simmer uncovered on medium heat for 3–5 minutes until it thickens to your liking."
  - "Finish and serve: Stir in garam masala, taste and adjust salt. Garnish with fresh coriander. Serve hot with rice, idli, or dosa."
