title: Mild Khichdi
tags:
  - Indian
  - Rice
  - Vegetarian
  - Pressure cooker
servings: 2
ingredients:
  - name: Ponni boiled rice (uncooked)
    amount: 150
    unit: g
  - name: split yellow moong dal (no soaking needed)
    amount: 75
    unit: g
  - name: potato, diced 1cm (small pieces)
    amount: 120
    unit: g
  - name: tomato, finely chopped
    amount: 120
    unit: g
  - name: onion, finely chopped
    amount: 90
    unit: g
  - name: capsicum, finely diced
    amount: 120
    unit: g
  - name: button mushrooms, finely diced (not quartered — melts invisibly)
    amount: 120
    unit: g
  - name: carrot, diced 1cm
    amount: 80
    unit: g
  - name: zucchini, finely chopped
    amount: 80
    unit: g
  - name: water
    amount: 760
    unit: ml
  - name: ghee or butter (slightly more for richness)
    amount: 40
    unit: g
  - name: cumin seeds
    amount: 1.5
    unit: tsp
  - name: turmeric
    amount: 0.75
    unit: tsp
  - name: garam masala (warmth without heat)
    amount: 0.25
    unit: tsp
  - name: salt (slightly less than usual)
    amount: 1.25
    unit: tsp
  - name: black pepper (just a hint)
    amount: 0.25
    unit: tsp
  - name: lemon juice — just a few drops, not sour
    amount: 0.5
    unit: tsp
instructions:
  - "Rinse and chop everything small: Rinse Ponni boiled rice and split yellow moong dal together under cold water once. Finely dice all vegetables smaller than usual — potato and carrot at 1cm, everything else chopped small. The finer the cut the more they melt into the khichdi invisibly."
  - "Dump everything in: Add everything into the pressure cooker — Ponni boiled rice, split yellow moong dal, potato, tomato, onion, capsicum, button mushrooms, carrot, zucchini, water, turmeric, salt and black pepper. Stir once to combine. No sautéing needed."
  - "Pressure cook (5 whistles): Close the lid. Cook on high until 5 whistles, then reduce to low for 5 minutes. Turn off and let pressure release naturally — about 8–10 minutes. Do not force open."
  - "Tadka with garam masala: Heat ghee or butter in a small pan on high until shimmering. Add cumin seeds and let them go almost brown — 30 to 40 seconds. Turn off heat, add garam masala into the hot ghee, stir for 5 seconds only — garam masala burns quickly. Pour immediately over khichdi and stir in well."
  - "Check consistency: Stir well and check consistency — slightly thick is best, easier to eat with a spoon. Too thin, stir on low heat uncovered for 2 minutes. Taste and adjust salt gently."
  - "Finish and serve: Add lemon juice — just a few drops, not the full squeeze. Stir in. Serve in a bowl with a small extra knob of butter melting on top and a dollop of plain yogurt on the side. Watch it disappear."
