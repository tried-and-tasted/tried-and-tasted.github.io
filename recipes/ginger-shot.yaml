title: Ginger Shot
tags:
  - International
  - Drink
  - Vegetarian
servings: 3
ingredients:
  - name: fresh ginger (organic, so no peeling needed)
    amount: 65
    unit: g
  - name: fresh lemon juice (about 1 organic lemon)
    amount: 26
    unit: ml
  - name: water
    amount: 50
    unit: ml
  - name: turmeric powder
    amount: 0.25
    unit: tsp
  - name: black pepper, freshly ground
    amount: 1
    unit: pinch
  - name: honey (optional)
    amount: 5
    unit: g
instructions:
  - "Prep ginger: Wash the ginger well and chop small (or grate finely). Peel only if it is not organic."
  - "Blend: Blend the ginger with water and fresh lemon juice until completely smooth."
  - "Strain: Pour through a fine sieve or muslin cloth and squeeze out all the liquid."
  - "Add spices: Stir in turmeric powder and black pepper, plus honey if you like it milder."
  - "Bottle and store: Pour into a small clean bottle, keep in the fridge, and drink 30 ml per day."
