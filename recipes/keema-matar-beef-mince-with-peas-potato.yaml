title: Keema Matar (Beef Mince with Peas & Potato)
tags:
  - North Indian
  - Curry
  - Pressure cooker
servings: 2
ingredients:
  - name: beef mince (5% fat preferred)
    amount: 300
    unit: g
  - name: frozen peas (straight from freezer)
    amount: 90
    unit: g
  - name: potato, diced 1.5cm
    amount: 120
    unit: g
  - name: onion, finely diced
    amount: 120
    unit: g
  - name: tomato, finely chopped
    amount: 120
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: fresh ginger, grated
    amount: 10
    unit: g
  - name: neutral oil or ghee
    amount: 18
    unit: g
  - name: water
    amount: 60
    unit: ml
  - name: cumin seeds
    amount: 1
    unit: tsp
  - name: turmeric
    amount: 0.75
    unit: tsp
  - name: coriander powder
    amount: 1
    unit: tsp
  - name: red chili powder
    amount: 0.75
    unit: tsp
  - name: garam masala
    amount: 0.75
    unit: tsp
  - name: cumin powder
    amount: 0.25
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: black pepper
    amount: 0.25
    unit: tsp
  - name: lemon juice added at the end
    amount: 10
    unit: ml
  - name: fresh coriander or parsley chopped (garnish)
    amount: 12
    unit: g
instructions:
  - "Caramelise onions (6-8 min): Heat neutral oil or ghee in the pressure cooker pot on medium-high. Add cumin seeds and let sizzle 30 seconds. Add onion and cook for 6–8 minutes until deep golden brown — stirring every 2 minutes. Do not rush on high heat. This caramelised onion base is where all the depth comes from."
  - "Build masala base: Add garlic cloves and fresh ginger, stir 1–2 minutes until raw smell disappears. Add turmeric, coriander powder, red chili powder, cumin powder and black pepper — stir 30 seconds. Add tomato and cook 5–6 minutes until tomatoes break down completely and oil separates at the edges. This is your masala base."
  - "Brown the mince (no pink remaining): Add beef mince (5% fat preferred) to the pot. Break up all clumps with spatula and mix thoroughly into the masala. Cook on high heat 4–5 minutes stirring continuously until fully browned — no pink remaining. Browning the mince before pressure cooking is what gives depth and colour."
  - "Add potato and pressure cook (2 whistles): Add potato and salt. Pour water over everything and stir. Close pressure cooker lid. Cook on high until 2 whistles, then reduce to low for 3 minutes. Turn off and let pressure release naturally — about 8 minutes."
  - "Add peas and garam masala: Open lid. Add frozen peas straight from freezer and garam masala. Stir well and cook uncovered on medium for 3–4 minutes until peas are cooked and any excess water evaporates. Keema should be thick and fairly dry — not watery."
  - "Finish with lemon and serve: Add lemon juice added at the end and stir. Taste and adjust salt. Scatter fresh coriander or parsley chopped on top. Serve hot with chapati or rice. Packs well in an airtight container — reheat with a splash of water microwave 2 minutes."
