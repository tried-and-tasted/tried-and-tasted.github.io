title: Spiced Vegetable & Moong Dal Soup
tags:
  - Indian
  - Soup
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: split yellow moong dal
    amount: 55
    unit: g
  - name: potato, roughly chopped
    amount: 200
    unit: g
  - name: carrot, roughly chopped
    amount: 200
    unit: g
  - name: capsicum mixed colours, roughly chopped
    amount: 200
    unit: g
  - name: tomato, roughly chopped
    amount: 150
    unit: g
  - name: onion, roughly chopped
    amount: 150
    unit: g
  - name: fresh spinach, washed (added last before blending)
    amount: 100
    unit: g
  - name: garlic cloves, crushed
    amount: 3
    unit: ""
  - name: fresh ginger, grated
    amount: 12
    unit: g
  - name: water
    amount: 800
    unit: ml
  - name: ghee or olive oil
    amount: 30
    unit: g
  - name: cumin seeds
    amount: 1
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: coriander powder
    amount: 1
    unit: tsp
  - name: garam masala
    amount: 0.5
    unit: tsp
  - name: red chili powder or mild paprika for a milder soup
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1.25
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: lemon juice — added after blending
    amount: 15
    unit: ml
  - name: sugar (optional — only if the soup tastes sharp)
    amount: 1
    unit: tsp
instructions:
  - "Rinse dal and rough chop (3 min): Rinse split yellow moong dal under cold water once. Roughly chop potato, carrot, capsicum mixed colours, tomato, onion — no need to be neat, everything gets blended. Crush garlic cloves and grate fresh ginger."
  - "Sauté base (4 min): Heat ghee or olive oil in the pressure cooker pot on medium. Add cumin seeds and let sizzle for 30 seconds. Add onion and stir for 3 minutes until softened. Add garlic cloves and fresh ginger, stir for 1 minute until fragrant."
  - "Add spices, vegetables and dal: Add turmeric, coriander powder, garam masala, red chili powder or mild paprika for a milder soup, salt and black pepper. Stir for 30 seconds. Add potato, carrot, capsicum mixed colours, tomato and rinsed split yellow moong dal. Pour water over everything. Stir once to combine."
  - "Pressure cook (3 whistles): Close the pressure cooker lid. Cook on high until 3 whistles, then reduce to low for 5 minutes. Turn off and let pressure release naturally — about 8–10 minutes."
  - "Add spinach AFTER opening — 2 minutes only: Open the lid. Add fresh spinach directly into the hot soup and stir in. Do not close the lid again. Let the residual heat wilt the spinach for exactly 2 minutes — it will turn bright green and soft. This preserves colour, nutrients and flavour."
  - "Blend until smooth: Use a stick blender directly in the pot and blend for 90 seconds until completely smooth and velvety. The moong dal and potato will have created a naturally thick creamy base. For ultra smooth result pass through a sieve."
  - "Add lemon and balance: Add lemon juice, stir and taste — adjust salt if needed. If the soup tastes sharp from the tomatoes, stir in the sugar (or just a pinch); with ripe tomatoes you can skip it. If too thick add a small splash of hot water and stir. Serve immediately or cool and portion for fridge or freezer."
