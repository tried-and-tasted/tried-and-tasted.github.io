title: Tamil Nadu Meen Kuzhambu (Dorade Royal)
tags:
  - South Indian
  - Curry
  - Pressure cooker
servings: 2
ingredients:
  - name: Dorade Royal, whole — scaled, gutted, cut into 4–5 thick steaks including head
    amount: 500
    unit: g
  - name: tamarind block (imli)
    amount: 25
    unit: g
  - name: hot water for soaking tamarind
    amount: 180
    unit: ml
  - name: onion, finely chopped
    amount: 120
    unit: g
  - name: tomatoes, finely chopped
    amount: 180
    unit: g
  - name: ginger garlic paste
    amount: 20
    unit: g
  - name: green chilli, slit
    amount: 1
    unit: ""
  - name: sesame oil (nallennai) or vegetable oil
    amount: 30
    unit: g
  - name: mustard seeds
    amount: 0.5
    unit: tsp
  - name: fenugreek seeds (methi)
    amount: 0.25
    unit: tsp
  - name: dried red chillies
    amount: 2
    unit: ""
  - name: curry leaves
    amount: 10
    unit: ""
  - name: turmeric powder — for marinade
    amount: 0.5
    unit: tsp
  - name: turmeric powder — for masala
    amount: 0.5
    unit: tsp
  - name: Kashmiri chilli powder — for marinade
    amount: 0.75
    unit: tsp
  - name: Kashmiri chilli powder — for masala
    amount: 1.25
    unit: tsp
  - name: coriander powder
    amount: 1.5
    unit: tsp
  - name: cumin powder
    amount: 0.75
    unit: tsp
  - name: black pepper powder
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: water for gravy
    amount: 100
    unit: ml
  - name: fresh coriander leaves, chopped — to garnish
    amount: 8
    unit: g
instructions:
  - "Soak the tamarind: Soak tamarind block in hot water for soaking tamarind for 15 minutes. Squeeze and strain well to get a thick tamarind water. Discard the pulp and seeds."
  - "Score & marinate the fish: Make 2–3 shallow diagonal cuts on each side of the fish steaks — this helps the marinade and curry penetrate. Rub all pieces including the head with turmeric powder, Kashmiri chilli powder, and a pinch of salt. Set aside for 10 minutes."
  - "Temper the spices: Heat sesame oil or vegetable oil in a wide heavy-bottomed pan (or pressure cooker base) on medium-high. Add mustard seeds and let them splutter. Add fenugreek seeds — fry 15 seconds until lightly golden, don't burn or it turns bitter. Add dried red chillies and curry leaves, fry 20 seconds."
  - "Cook the onions: Add onion and green chilli. Fry on medium heat for 10–12 minutes, stirring often, until deep golden brown. Don't rush — this is the flavour foundation."
  - "Add ginger garlic paste & masala spices: Add ginger garlic paste and fry for 2 minutes until the raw smell disappears. Then add turmeric powder, Kashmiri chilli powder, coriander powder, cumin powder, and black pepper powder. Stir on medium heat for 1 minute until fragrant."
  - "Cook the tomatoes: Add tomatoes and cook on medium heat for 8–10 minutes, mashing as they soften, until oil separates from the masala and the mixture looks thick and jammy."
  - "Add tamarind water & simmer: Pour in the strained tamarind water and water for gravy. Add remaining salt to taste. Bring to a boil, then simmer uncovered on medium-low for 10 minutes until the raw tamarind smell mellows and the gravy darkens."
  - "Add the whole fish & cook: Gently place the fish pieces in a single layer — head piece first as it needs slightly longer. Spoon gravy over everything. Cover and cook on LOW heat for 10–12 minutes. Do not stir; just gently shake the pan occasionally. Fish is done when the flesh near the bone flakes easily. Pressure cooker: close lid without weight/whistle, cook on lowest flame for 7–8 minutes."
  - "Rest & garnish: Turn off heat. Rest uncovered for 5 minutes — the gravy thickens and the gelatin from the bones enriches it. Garnish with fresh coriander leaves. Serve with steamed rice."
