title: German Lentil Soup
tags:
  - International
  - Soup
  - Pressure cooker
servings: 4
ingredients:
  - name: brown or green lentils
    amount: 300
    unit: g
  - name: potatoes, diced 1.5 cm
    amount: 200
    unit: g
  - name: carrots, diced
    amount: 150
    unit: g
  - name: celery stalks, sliced
    amount: 100
    unit: g
  - name: onion, finely diced
    amount: 150
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: smoked bacon cubes
    amount: 150
    unit: g
  - name: frankfurter sausages, sliced into rounds
    amount: 3
    unit: ""
  - name: vegetable or chicken broth (from stock cubes)
    amount: 1200
    unit: ml
  - name: olive oil or butter
    amount: 30
    unit: g
  - name: bay leaves
    amount: 2
    unit: ""
  - name: dried thyme
    amount: 1
    unit: tsp
  - name: white wine vinegar — the German secret
    amount: 1
    unit: tbsp
  - name: medium-hot mustard
    amount: 1
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
instructions:
  - "Prep the vegetables: Rinse brown or green lentils under cold water. No soaking needed for brown lentils — this is one of the easiest legumes to cook. Dice potatoes, carrots, celery stalks into similar-sized pieces so they cook evenly."
  - "Fry bacon and onions: Heat olive oil or butter in the pressure cooker pot on medium-high. Add smoked bacon cubes and fry for 3 minutes until the fat renders and the edges start to crisp. Add onion and cook for 4–5 minutes until soft and golden. Add garlic cloves and stir for 1 minute."
  - "Add lentils and broth: Add carrots, celery stalks, and potatoes to the pot. Stir for 2 minutes. Add rinsed brown or green lentils, pour in vegetable or chicken broth, add bay leaves and dried thyme. Stir everything together."
  - "Pressure cook (25 min total): Close the pressure cooker lid. Cook on high until 2 whistles, then reduce to low for 8 minutes. Turn off and let pressure release naturally (about 10 minutes). Open lid carefully."
  - "Regular pot option (35–40 min): No pressure cooker? Bring to a boil, then simmer covered on medium-low for 35–40 minutes, stirring occasionally, until lentils are completely soft."
  - "Add sausages and season: Remove bay leaves. Stir in the sausage slices — they just need 2 minutes in the hot soup. Add white wine vinegar, medium-hot mustard, salt, and black pepper. Taste and adjust — the vinegar should give a gentle tang, not sourness. Add a splash more broth if too thick."
  - "Pack and store: Let cool before portioning into airtight containers. To reheat, add 30 ml water before microwaving for 2 minutes, stirring once halfway. The soup freezes well for up to 3 months in portions."
