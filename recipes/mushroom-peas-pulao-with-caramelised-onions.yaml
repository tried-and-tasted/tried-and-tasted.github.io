title: Mushroom & Peas Pulao with Caramelised Onions
tags:
  - North Indian
  - Rice
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: basmati rice
    amount: 300
    unit: g
  - name: button mushrooms, thickly sliced
    amount: 250
    unit: g
  - name: frozen peas (straight from freezer)
    amount: 150
    unit: g
  - name: onion, thinly sliced (for caramelising)
    amount: 200
    unit: g
  - name: onion, finely diced (for base)
    amount: 100
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: fresh ginger, grated
    amount: 10
    unit: g
  - name: water or vegetable broth
    amount: 480
    unit: ml
  - name: ghee or neutral oil
    amount: 40
    unit: g
  - name: bay leaves
    amount: 2
    unit: ""
  - name: green cardamom pods, lightly crushed
    amount: 4
    unit: ""
  - name: cinnamon stick
    amount: 1
    unit: ""
  - name: cloves
    amount: 4
    unit: ""
  - name: cumin seeds
    amount: 1
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: coriander powder
    amount: 1
    unit: tsp
  - name: garam masala
    amount: 0.5
    unit: tsp
  - name: red chili powder (or mild paprika for less heat)
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1.25
    unit: tsp
  - name: fresh coriander or parsley, chopped (garnish)
    amount: 20
    unit: g
  - name: cashews or raisins (optional)
    amount: 30
    unit: g
instructions:
  - "Rinse and soak basmati (20 min): Rinse basmati rice under cold water 2–3 times until water runs clear. Soak in cold water for 20 minutes while you prep everything else. This gives fluffier, more separate grains in the final pulao."
  - "Caramelise the onions (15-18 min — the showstopper): Heat 20 g of ghee or neutral oil in the pressure cooker pot on medium-high. Add onion — the sliced onions for caramelising. Cook on medium heat for 15–18 minutes, stirring every 2–3 minutes, until deep golden brown and slightly crispy at the edges. Do not rush this on high heat — low and slow is key. Remove and set aside on a plate."
  - "Fry whole spices and onion base: In the same pot add remaining ghee or neutral oil. Add bay leaves, green cardamom pods, cinnamon stick, cloves and cumin seeds. Let them sizzle for 30 seconds until fragrant. Add onion (diced onion) and cook for 4 minutes until soft. Add garlic cloves and fresh ginger, stir for 1 minute."
  - "Add mushrooms and ground spices: Add button mushrooms and stir fry on high for 3–4 minutes until the mushrooms release their water and start to brown at the edges. Add turmeric, coriander powder, garam masala, red chili powder (or mild paprika for less heat) and salt. Stir for 1 minute."
  - "Add rice, peas and water: Drain soaked basmati rice and add to the pot. Gently stir to coat the rice with all the spices and mushrooms. Add frozen peas straight from freezer. Pour water or vegetable broth over everything. Stir once gently — do not break the rice grains."
  - "Pressure cook (2 whistles only for basmati): Close pressure cooker lid. Cook on high until 2 whistles only — basmati is delicate and overcooks faster than Ponni rice. Immediately turn off heat and let pressure release naturally for 10 minutes. Do not force open."
  - "Fluff and finish: Open lid carefully. Fluff rice very gently with a fork — do not stir aggressively or the grains break. Remove bay leaves, cinnamon stick before serving. If using cashews or raisins, quickly fry cashews in a tiny bit of ghee in a small pan until golden and scatter over the top."
  - "Top with caramelised onions and serve: Scatter the caramelised onions generously over the top. Add fresh coriander or parsley. Serve immediately or cool completely before portioning into containers for fridge or freezer. The caramelised onions can be stored separately and added when reheating for best texture."
