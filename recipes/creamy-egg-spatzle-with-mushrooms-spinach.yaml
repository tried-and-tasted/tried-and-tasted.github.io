title: Creamy Egg Spätzle with Mushrooms & Spinach
tags:
  - International
  - Pasta & Noodles
  - Vegetarian
servings: 2
ingredients:
  - name: egg spätzle (readymade)
    amount: 300
    unit: g
  - name: button mushrooms, thickly sliced
    amount: 200
    unit: g
  - name: fresh spinach
    amount: 100
    unit: g
  - name: onion, thinly sliced
    amount: 120
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: whole eggs
    amount: 2
    unit: ""
  - name: egg yolks (extra richness)
    amount: 2
    unit: ""
  - name: Parmesan or young Gouda, finely grated
    amount: 40
    unit: g
  - name: butter
    amount: 20
    unit: g
  - name: olive oil
    amount: 14
    unit: g
  - name: Spätzle cooking water (reserve before draining)
    amount: 60
    unit: ml
  - name: black pepper (generous — essential for carbonara style)
    amount: 0.5
    unit: tsp
  - name: nutmeg, grated (classic German touch with Spätzle)
    amount: 0.25
    unit: tsp
  - name: salt
    amount: 0.75
    unit: tsp
  - name: lemon juice — added at the end
    amount: 10
    unit: ml
  - name: fresh parsley or chives, chopped (garnish)
    amount: 15
    unit: g
instructions:
  - "Make egg sauce first: In a bowl whisk together whole eggs, egg yolks, Parmesan or young Gouda, black pepper and nutmeg. Set aside at room temperature — never add cold eggs to hot pan. This is your sauce."
  - "Cook Spätzle (1 min) — reserve cooking water: Bring a pot of water to boil. Add a pinch of salt. Add egg spätzle and cook for exactly 1 minute. Before draining scoop out Spätzle cooking water with a mug — this starchy water is essential for the sauce. Drain and set aside."
  - "Caramelise onions (7-8 min): Heat olive oil in a wide pan on medium-high. Add onion and cook for 7–8 minutes stirring every 2 minutes until deep golden brown and slightly caramelised. Add garlic cloves garlic and stir 1 minute."
  - "Brown mushrooms — don't stir for first 2 min: Increase heat to high. Add butter. Add button mushrooms in a single layer — do not stir for 2 minutes. Let them brown undisturbed. Then toss and cook 2 more minutes until golden and all water has evaporated. Season with a pinch of salt."
  - "Wilt spinach (1 min): Add fresh spinach directly to the pan. Stir for 1 minute until completely wilted and any water evaporates. The pan should look dry — not watery."
  - "Combine — heat OFF before adding eggs: Add drained egg spätzle to the pan and toss well with vegetables. Turn heat OFF completely. Wait 60 seconds for pan to cool slightly — critical step. Pour egg mixture over Spätzle and toss vigorously while adding cooking water a splash at a time until glossy and creamy. Residual heat gently cooks the eggs into a silky sauce."
  - "Finish with lemon and serve: Add lemon juice and toss gently. Taste and adjust salt. Scatter fresh parsley or chives on top. Serve immediately or cool and pack for later. Reheat with 2 tbsp water, microwave 90 seconds stirring halfway."
