title: Keema Matar (Spiced Beef Mince with Peas)
tags:
  - North Indian
  - Curry
  - Pressure cooker
servings: 4
ingredients:
  - name: beef mince
    amount: 500
    unit: g
  - name: frozen peas
    amount: 200
    unit: g
  - name: onions, finely diced
    amount: 200
    unit: g
  - name: garlic cloves, minced
    amount: 4
    unit: ""
  - name: fresh ginger, grated (about a 2 cm piece)
    amount: 15
    unit: g
  - name: canned chopped tomatoes
    amount: 200
    unit: g
  - name: vegetable oil or ghee
    amount: 40
    unit: g
  - name: cumin seeds
    amount: 1
    unit: tsp
  - name: bay leaf
    amount: 1
    unit: ""
  - name: turmeric powder
    amount: 0.5
    unit: tsp
  - name: coriander powder
    amount: 2
    unit: tsp
  - name: cumin powder
    amount: 1
    unit: tsp
  - name: mild paprika (or chilli powder for heat)
    amount: 1
    unit: tsp
  - name: garam masala
    amount: 1
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: water
    amount: 100
    unit: ml
  - name: fresh parsley or coriander, chopped (garnish)
    amount: 2
    unit: tbsp
instructions:
  - "Prep the aromatics: Finely dice the onions. Mince or grate the garlic and ginger. Having everything ready before you start makes cooking much easier!"
  - "Bloom the spices: Heat the oil or ghee in your pressure cooker (or a heavy pot) over medium-high heat. Add the cumin seeds and bay leaf. Wait about 30 seconds until the cumin seeds sizzle and pop — this releases their aroma into the oil."
  - "Fry the onions: Add the onions and fry for 6–8 minutes, stirring occasionally, until golden brown. Don't rush this step — golden onions are the base of the flavour."
  - "Add garlic & ginger: Add the garlic and ginger. Fry for 1–2 minutes until the raw smell disappears."
  - "Add the spices: Lower the heat slightly. Add the turmeric, coriander powder, cumin powder and paprika or chilli powder. Stir for 30 seconds, then pour in the canned tomatoes to prevent burning. Mix well and cook for 2 minutes."
  - "Brown the mince: Add the beef mince and break it apart with a spoon. Stir well to coat the meat in the spice mixture. Cook on medium-high heat for 4–5 minutes, stirring, until the meat is no longer pink and starts to brown."
  - "Pressure cook (recommended): Add the water and salt. Close the pressure cooker lid and cook on high pressure for 8 minutes (2 whistles on a stovetop cooker). Release pressure naturally for 5 minutes, then open. No pressure cooker? Use twice the water, cover and simmer on low heat for 20–25 minutes, stirring every 5 minutes; add a splash of water if it looks dry."
  - "Add peas & finish: Open the cooker and stir in the frozen peas and garam masala. Cook uncovered on medium heat for 3–4 minutes until the peas are tender and any excess water has evaporated. The keema should look moist but not watery."
  - "Garnish & serve: Taste and adjust salt. Garnish with fresh parsley or coriander. Serve hot with basmati rice, naan or toasted flatbread."
