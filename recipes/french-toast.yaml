title: French Toast
tags:
  - International
  - Breakfast
  - Vegetarian
servings: 1
ingredients:
  - name: American sandwich toast (101 cal/slice, 37.5 g each)
    amount: 3
    unit: piece
  - name: egg
    amount: 1
    unit: piece
  - name: whole milk
    amount: 40
    unit: ml
  - name: plain yogurt
    amount: 30
    unit: g
  - name: butter (for frying)
    amount: 10
    unit: g
  - name: sugar
    amount: 1
    unit: tsp
  - name: vanilla extract
    amount: 1.5
    unit: ml
  - name: ground cinnamon
    amount: 0.25
    unit: tsp
  - name: salt
    amount: 1
    unit: pinch
  - name: powdered sugar (to serve)
    amount: 1
    unit: tsp
instructions:
  - "Make the custard: In a wide shallow bowl, whisk together egg, whole milk, plain yogurt, sugar, vanilla extract, ground cinnamon (¼ tsp), and salt until smooth."
  - "Soak the bread: Dip each slice of American sandwich toast into the custard for 15–20 seconds per side. Don’t over-soak — these are thicker slices so the outside can get mushy before the inside soaks through."
  - "Fry the toast: Melt butter in a non-stick pan over medium heat. Fry the soaked slices for 2–3 minutes per side until golden brown."
  - "Serve: Dust with powdered sugar and serve immediately with yogurt or honey."
