title: Smooth Chicken Bone Broth Soup
tags:
  - International
  - Soup
  - Pressure cooker
servings: 2
ingredients:
  - name: chicken thigh bones (leftover, rinsed)
    amount: 100
    unit: g
  - name: potato, roughly chopped (natural thickener)
    amount: 90
    unit: g
  - name: capsicum mixed colours, roughly chopped
    amount: 100
    unit: g
  - name: tomato, roughly chopped
    amount: 100
    unit: g
  - name: onion, roughly chopped
    amount: 80
    unit: g
  - name: garlic cloves, crushed
    amount: 3
    unit: ""
  - name: fresh ginger, sliced
    amount: 8
    unit: g
  - name: water
    amount: 700
    unit: ml
  - name: cumin powder
    amount: 0.25
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: coriander powder
    amount: 0.5
    unit: tsp
  - name: black pepper
    amount: 0.25
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: bay leaves
    amount: 2
    unit: ""
  - name: ghee (stirred in after blending)
    amount: 10
    unit: g
  - name: lemon juice — added after blending
    amount: 10
    unit: ml
  - name: fresh coriander or parsley, chopped (garnish)
    amount: 15
    unit: g
instructions:
  - "Rinse bones and rough chop (2 min): Rinse chicken thigh bones under cold water. Pat dry. Roughly chop all vegetables — no need to be neat, everything gets blended."
  - "Dump everything in — no frying, no oil: Add everything directly into the pressure cooker in this order: chicken thigh bones, onion, potato, capsicum, tomato, garlic and ginger, then turmeric, coriander powder, cumin powder, black pepper, salt and bay leaves. Pour the water over everything and stir once."
  - "Pressure cook (4 whistles + 10 min low): Close the pressure cooker lid. Cook on high until 4 whistles then reduce to low for 10 minutes. Turn off and let pressure release naturally — about 10 minutes. Longer cook extracts maximum collagen and minerals from bones."
  - "Remove ALL bones carefully — critical step before blending: Open lid carefully. Remove bay leaves first. Now carefully fish out every single bone using tongs or a slotted spoon. Check thoroughly — go slowly, small bone fragments can be present. This step is critical before using the stabmixer. Any tiny flesh that fell off the bones stays in the soup."
  - "Blend with stabmixer directly in pot: Insert stabmixer directly into the pot. Blend for 90 seconds until completely smooth and velvety. Keep the stabmixer head submerged at all times to avoid hot soup splashing. Tilt the pot slightly if needed to get the mixer fully submerged."
  - "Stir in ghee and lemon, then serve: Add the ghee right after blending while the soup is hot and stir vigorously for 10 seconds so it blends in rather than floating on top. Add lemon juice and stir. Taste and adjust salt. If too thick add a small splash of hot water and stir. Scatter fresh coriander or parsley on top. Serve hot with chapati or toasted bread."
