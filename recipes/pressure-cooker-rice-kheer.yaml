title: Pressure Cooker Rice Kheer
tags:
  - Indian
  - Sweet
  - Vegetarian
  - Pressure cooker
servings: 6
ingredients:
  - name: basmati rice
    amount: 80
    unit: g
  - name: whole milk (3.5%)
    amount: 1000
    unit: ml
  - name: sugar (50 g is still sweet enough)
    amount: 68
    unit: g
  - name: ghee
    amount: 5
    unit: g
  - name: cardamom powder
    amount: 0.5
    unit: tsp
  - name: pistachios and cashews, chopped
    amount: 22
    unit: g
instructions:
  - "Rinse the rice and soak it for 15 minutes, then drain."
  - "Heat the ghee in the pressure cooker, add the rice and stir for 1 minute."
  - "Add the milk and stir well. Keep the cooker less than half full, because milk foams up. A steel spoon in the milk helps stop it boiling over."
  - "Close the lid and cook on medium-low heat for 3 whistles, so it comes to pressure slowly."
  - "Let the pressure release naturally for 10 minutes. Do not force the valve, or milk will spurt out."
  - "Open the lid and simmer on low for 5 to 8 minutes, stirring, until thick. Mash a few grains against the side for creaminess."
  - "Add the sugar, cardamom and nuts, and stir until the sugar dissolves. Adding sugar only now stops the bottom scorching."
  - "Serve warm or chilled — it thickens a lot as it cools, so add a splash of milk if needed. Clean the vent pipe afterwards, as dried milk can block it."
