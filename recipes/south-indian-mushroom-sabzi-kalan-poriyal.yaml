title: South Indian Mushroom Sabzi (Kalan Poriyal)
tags:
  - South Indian
  - Side
  - Vegetarian
servings: 3
ingredients:
  - name: button mushrooms, quartered
    amount: 400
    unit: g
  - name: onion, finely chopped
    amount: 1
    unit: ""
  - name: tomato, finely chopped
    amount: 1
    unit: ""
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: fresh ginger, grated
    amount: 10
    unit: g
  - name: green chilli, slit
    amount: 2
    unit: ""
  - name: sunflower oil
    amount: 30
    unit: g
  - name: lemon juice
    amount: 10
    unit: ml
  - name: mustard seeds
    amount: 1
    unit: tsp
  - name: cumin seeds
    amount: 0.5
    unit: tsp
  - name: turmeric powder
    amount: 0.5
    unit: tsp
  - name: coriander powder
    amount: 1
    unit: tsp
  - name: red chilli powder or mild paprika
    amount: 0.75
    unit: tsp
  - name: garam masala
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 0.75
    unit: tsp
  - name: dried red chilli
    amount: 2
    unit: ""
  - name: curry leaves (fresh or dried)
    amount: 10
    unit: ""
  - name: fresh coriander leaves, chopped
    amount: 10
    unit: g
instructions:
  - "Clean the mushrooms: Fill a bowl with cold water. Drop the mushrooms in, swish gently for 10–15 seconds, then lift out immediately — don't let them soak. Spread on a clean kitchen towel and pat dry well. Let air dry for 15–20 minutes. For stubborn soil, use a soft brush under a gentle trickle of water, then dry immediately."
  - "Chop and quarter: Quarter the dried mushrooms. Finely chop the onion and tomato. Mince the garlic, grate the ginger and slit the green chillies lengthwise. Set everything aside in separate bowls."
  - "Temper the spices: Heat 6.5 tsp oil in a wide pan on medium-high. Add mustard seeds — wait for them to splutter (about 20 seconds), then add cumin seeds, dried red chilli and curry leaves. Stir 15 seconds until fragrant. Don't let them burn."
  - "Sauté aromatics: Add onion and green chilli. Sauté 5–6 minutes until golden. Add garlic and ginger, stir 1 minute until the raw smell disappears."
  - "Add tomato and spices: Add tomato, then turmeric, coriander powder, chilli powder and salt. Mix well. Cook until the tomato softens and oil starts to separate from the sides, about 3–4 minutes."
  - "Cook the mushrooms: Add all 400 g mushrooms and toss well to coat with the masala. Cook on medium-high heat WITHOUT a lid — this lets the water evaporate so the sabzi stays dry and gets a slight char. Stir occasionally for 7–8 minutes until the mushrooms shrink and no liquid remains in the pan."
  - "Finish: Add garam masala, toss and cook 1 more minute. Turn off the heat. Squeeze lemon juice over and mix. Garnish with fresh coriander. Serve hot with rice, chapati or dosa."
