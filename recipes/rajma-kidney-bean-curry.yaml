title: Rajma (Kidney Bean Curry)
tags:
  - North Indian
  - Curry
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: dry red kidney beans, rinsed
    amount: 150
    unit: g
  - name: water (for cooking beans)
    amount: 750
    unit: ml
  - name: onion, finely diced
    amount: 150
    unit: g
  - name: vegetable oil
    amount: 30
    unit: g
  - name: fresh tomatoes, grated or finely chopped
    amount: 500
    unit: g
  - name: fresh ginger, grated
    amount: 1
    unit: tbsp
  - name: garlic cloves, minced
    amount: 2
    unit: ""
  - name: cumin seeds
    amount: 1
    unit: tsp
  - name: turmeric powder
    amount: 0.5
    unit: tsp
  - name: red chilli powder
    amount: 1
    unit: tsp
  - name: garam masala
    amount: 1
    unit: tsp
  - name: salt
    amount: 0.5
    unit: tsp
  - name: black pepper
    amount: 0.25
    unit: tsp
  - name: water (for the curry)
    amount: 190
    unit: ml
instructions:
  - "Cook the beans: Rinse the beans well 2–3 times. Put them in an Indian pressure cooker with 750 ml water, close and heat on high until the first whistle, then lower to medium-high. Cook for 5–6 whistles in total (6 if the beans are old). Turn off and let the pressure release naturally for 10–15 minutes. The beans should be easy to pierce with a fork. Drain, keeping about 250 ml of the cooking liquid with the beans."
  - "Temper: In the same cooker on medium-high heat, heat the oil and add the cumin seeds. When they crackle (about 20 seconds), add the onion and cook 2–3 minutes until soft and golden."
  - "Spice base: Add the ginger and garlic and stir 30 seconds. Add the turmeric and chilli powder and stir quickly for 30 seconds so they do not burn. Add the tomatoes and cook 2–3 minutes until they start breaking down."
  - "Pressure cook: Add the 190 ml water and the cooked beans with their liquid. Close the lid and cook on high for 1–2 whistles, then turn off and let the pressure release naturally (3–5 minutes)."
  - "Slow simmer for a smooth curry: Add the garam masala, salt and black pepper. Simmer uncovered on low heat for 8–10 minutes, stirring every 2 minutes, until the tomatoes and beans break down into a creamy sauce (12–15 minutes for even creamier). Taste and adjust. Serve hot with rice or roti — for a milder version use ½ tsp chilli powder and stir in 2 tbsp yogurt at the end."
