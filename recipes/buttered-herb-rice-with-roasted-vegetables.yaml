title: Buttered Herb Rice with Roasted Vegetables
tags:
  - International
  - Rice
  - Vegetarian
  - Air fryer
servings: 4
ingredients:
  - name: basmati or long grain rice
    amount: 300
    unit: g
  - name: water or vegetable broth
    amount: 540
    unit: ml
  - name: butter (Butter)
    amount: 30
    unit: g
  - name: garlic cloves, minced
    amount: 2
    unit: ""
  - name: fresh parsley or chives, chopped
    amount: 15
    unit: g
  - name: zucchini, diced 2 cm (Zucchini)
    amount: 200
    unit: g
  - name: bell pepper, diced 2 cm (Paprika, mixed colours)
    amount: 200
    unit: g
  - name: broccoli, cut into small florets
    amount: 200
    unit: g
  - name: cherry tomatoes, halved
    amount: 150
    unit: g
  - name: red onion, cut into wedges
    amount: 100
    unit: g
  - name: olive oil (for vegetables)
    amount: 40
    unit: g
  - name: dried thyme
    amount: 1
    unit: tsp
  - name: dried rosemary, crushed
    amount: 0.5
    unit: tsp
  - name: garlic powder
    amount: 0.5
    unit: tsp
  - name: salt for vegetables
    amount: 1
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: salt for rice
    amount: 0.75
    unit: tsp
  - name: Parmesan or Grana Padano, grated (optional finish)
    amount: 30
    unit: g
instructions:
  - "Season the vegetables: Preheat oven to 220°C (or air fryer to 200°C). Toss zucchini, bell pepper, broccoli, cherry tomatoes, and red onion in a large bowl with olive oil, dried thyme, dried rosemary, garlic powder, salt for vegetables, and black pepper. Make sure every piece is coated."
  - "Roast the vegetables (oven or air fryer): Spread vegetables in a single layer on a baking tray — don't pile them up or they'll steam instead of roast. Roast at 220°C for 22–25 minutes, tossing once halfway, until edges are caramelised and slightly charred. Air fryer: 200°C for 15 minutes, shake basket halfway."
  - "Toast rice in butter: While vegetables roast, melt butter in a saucepan on medium heat. Add garlic cloves and stir for 60 seconds until fragrant but not browned. Add rinsed basmati or long grain rice and stir to coat every grain in the butter — toast for 1–2 minutes until it smells nutty."
  - "Cook the rice: Pour water or vegetable broth into the rice pot, add salt for rice, stir once and bring to a boil. Reduce heat to the lowest setting, cover tightly with a lid and cook for 12 minutes. Do not lift the lid. Remove from heat and rest covered for 5 minutes — this finishes the cooking with steam."
  - "Combine and pack: Fluff rice with a fork and stir in fresh parsley or chives. Taste and adjust salt. Spoon rice into containers, pile roasted vegetables on top. Finish with Parmesan or Grana Padano if using. Pack with a small lemon wedge on the side — a squeeze before eating brightens everything."
