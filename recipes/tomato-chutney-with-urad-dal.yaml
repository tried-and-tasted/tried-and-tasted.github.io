title: Tomato Chutney with Urad Dal
tags:
  - South Indian
  - Chutney
  - Vegetarian
  - Pressure cooker
servings: 3
ingredients:
  - name: ripe tomatoes, roughly chopped
    amount: 350
    unit: g
  - name: onion, finely diced
    amount: 100
    unit: g
  - name: garlic cloves
    amount: 2
    unit: ""
  - name: fresh ginger
    amount: 7
    unit: g
  - name: green chili (2 for more heat)
    amount: 1
    unit: ""
  - name: urad dal
    amount: 2
    unit: tsp
  - name: chana dal (optional)
    amount: 2
    unit: tsp
  - name: rapeseed oil
    amount: 20
    unit: g
  - name: mustard seeds
    amount: 0.5
    unit: tsp
  - name: dried red chili
    amount: 1
    unit: ""
  - name: curry leaves (optional)
    amount: 10
    unit: ""
  - name: turmeric
    amount: 0.25
    unit: tsp
  - name: ground cumin
    amount: 0.33
    unit: tsp
  - name: asafoetida / hing (optional, gluten-free)
    amount: 1
    unit: pinch
  - name: salt
    amount: 0.75
    unit: tsp
  - name: sugar (optional, balances acidity)
    amount: 0.25
    unit: tsp
  - name: fresh coriander
    amount: 1
    unit: small bunch
instructions:
  - "Prep: Roughly chop the tomatoes and finely dice the onion. Finely chop or grate the ginger, garlic and green chili."
  - "Temper: Heat the oil in a medium pan over medium heat. Add the mustard seeds and wait until they crackle. Add the urad dal, chana dal, dried red chili and curry leaves and stir 2–3 minutes until golden — not dark brown, or they turn bitter."
  - "Onion: Add the onion and fry 5–6 minutes until soft and lightly golden."
  - "Spices: Stir in the ginger, garlic and green chili and cook 1 minute until fragrant. Add the turmeric, cumin and asafoetida."
  - "Tomatoes: Add the tomatoes, salt and sugar and simmer over medium heat for 8–10 minutes until soft and pulpy. (Pressure cooker: after this step close the lid and cook 4 minutes on high pressure, then release naturally.)"
  - "Finish: Stir in the chopped coriander. Blend smooth with a hand blender or leave chunky. Good warm or cooled with rice, chapati, dosa or idli; keeps 4–5 days in the fridge."
