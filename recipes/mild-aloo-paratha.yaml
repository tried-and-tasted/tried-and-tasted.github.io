title: Mild Aloo Paratha
tags:
  - North Indian
  - Bread
  - Vegetarian
  - Pressure cooker
servings: 2
ingredients:
  - name: spelt flour (type 630) or wheat flour (type 1050)
    amount: 150
    unit: g
  - name: water, warm
    amount: 80
    unit: ml
  - name: salt for dough
    amount: 0.5
    unit: tsp
  - name: sunflower oil for dough
    amount: 5
    unit: g
  - name: potatoes, boiled and peeled
    amount: 250
    unit: g
  - name: fresh coriander, finely chopped
    amount: 8
    unit: g
  - name: fresh ginger, grated
    amount: 5
    unit: g
  - name: cumin seeds (Indian grocery store)
    amount: 0.5
    unit: tsp
  - name: coriander powder (Indian grocery store)
    amount: 0.5
    unit: tsp
  - name: garam masala (Indian grocery store)
    amount: 0.25
    unit: tsp
  - name: salt for filling
    amount: 0.5
    unit: tsp
  - name: lemon juice
    amount: 5
    unit: ml
  - name: butter for cooking / Butter
    amount: 20
    unit: g
instructions:
  - "Boil potatoes (pressure cooker): Boil potatoes in a pressure cooker with 200ml water. Cook on high until 3 whistles, then turn off. Let pressure release naturally. Peel and leave to steam-dry for 5 minutes — this stops the filling from becoming watery."
  - "Make the dough: In a large bowl, mix spelt flour (type 630) or wheat flour (type 1050), salt for dough, and sunflower oil for dough. Gradually add water and knead for 6–8 minutes until smooth and soft like playdough. Cover with a damp cloth."
  - "Rest the dough: Cover and rest the dough for 20 minutes. This is important — it makes rolling much easier and gives softer parathas."
  - "Make the mild filling: Mash potatoes very thoroughly — zero lumps, or they will tear the dough when rolling. Add fresh coriander, fresh ginger, cumin seeds, coriander powder, garam masala, salt for filling, and lemon juice. Mix well. Taste — it should be mild, savoury, and slightly tangy with no heat at all."
  - "Fill and seal: Divide dough into 4 balls (~55g each). Divide filling into 2 portions (~120g each). Flatten one dough ball into a 10cm disc, place one filling portion in the centre, bring edges up and pinch tightly to seal. Flatten gently. Place a second flattened dough ball on top as a lid and press edges to seal completely."
  - "Roll out gently: Dust your work surface lightly with flour. Gently roll the stuffed ball into a circle ~18–20cm wide and ~4mm thick. If filling shows through, dust with a little flour and keep rolling — it's fine!"
  - "Cook on the pan: Heat a flat non-stick pan (or cast iron skillet) on medium heat. Place paratha on the dry pan. Cook ~60–90 seconds until bubbles form on top, then flip."
  - "Add butter and finish: Add ~10g of butter for cooking / Butter on the top after flipping. Flip again, add remaining butter. Press gently with a spatula. Cook 1–2 minutes each side until golden with light brown spots. Repeat for the second paratha."
  - "Serve: Cut into quarters like a pizza. Serve warm with plain yogurt or sour cream on the side for dipping. A small knob of butter on top makes it extra special!"
