title: Everyday Khichdi
tags:
  - Indian
  - Rice
  - Vegetarian
  - Pressure cooker
servings: 2
ingredients:
  - name: Ponni boiled rice (uncooked)
    amount: 150
    unit: g
  - name: toor dal (or whole moong soaked 4hrs)
    amount: 75
    unit: g
  - name: zucchini, roughly chopped
    amount: 100
    unit: g
  - name: tomato, roughly chopped
    amount: 100
    unit: g
  - name: onion, roughly chopped
    amount: 100
    unit: g
  - name: frozen mixed vegetables (broccoli, cauliflower, carrot) (straight from freezer)
    amount: 100
    unit: g
  - name: water (reduced for water-rich vegetables)
    amount: 710
    unit: ml
  - name: ghee or butter (slightly more than before for stronger tadka)
    amount: 30
    unit: g
  - name: cumin seeds (slightly more than before)
    amount: 1.5
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: salt (slightly more — flavour fades in container)
    amount: 1.25
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: lemon juice (squeeze just before closing container)
    amount: 0.5
    unit: tsp
instructions:
  - "Soak dal if needed, rinse rice: If using whole moong, it must be soaked minimum 4 hours or overnight. Toor dal needs no soaking but benefits from 20–30 minutes if you have time. Rinse Ponni boiled rice and toor dal together under cold water once."
  - "Dump everything in (2 min): Roughly chop zucchini, tomato and onion — uneven chunks are fine. Add everything into the pressure cooker — Ponni boiled rice, toor dal, zucchini, tomato, onion, frozen mixed vegetables (broccoli, cauliflower, carrot) straight from freezer, water, turmeric, salt and black pepper. Stir once."
  - "Pressure cook (6 whistles for toor dal): Close lid. Toor dal: cook on high until 6 whistles, then low for 5 minutes. Whole soaked moong: 6–7 whistles, then low for 5 minutes. Turn off and let pressure release naturally — about 10 minutes."
  - "Pre-warm insulated container: While pressure releases, fill your insulated container with boiling water from the kettle. Close lid and pre-warm for 2 minutes. Empty just before filling."
  - "Darker tadka — the key flavour fix: Heat ghee or butter in a small pan on high until shimmering. Add cumin seeds and let them sizzle until almost brown — deeper than just popping, about 30–40 seconds. This darker roast is what carries flavour through hours of sitting. Pour immediately over khichdi and stir in."
  - "Check consistency and seasoning: Open pressure cooker and stir well. Should look like a loose porridge — slightly more liquid than eating consistency as it thickens while sitting. If too thick add a splash of hot water. Taste and adjust salt if needed."
  - "Add lemon and pack: Empty pre-warming water from container. Fill with hot khichdi. Squeeze lemon juice directly into the container and stir in. Close tightly immediately. This lemon step takes 5 seconds and makes the biggest flavour difference at lunchtime."
  - "To eat later: Stays warm and flavourful for 4–5 hours in an insulated container. Stir in yogurt or add a spoon of pickle for extra flavour if you brought it."
