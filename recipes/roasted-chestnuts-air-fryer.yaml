title: Roasted Chestnuts (Air Fryer)
tags:
  - International
  - Snack
  - Vegetarian
  - Pressure cooker
  - Air fryer
servings: 4
ingredients:
  - name: sweet chestnuts (never horse chestnuts, which are toxic)
    amount: 500
    unit: g
  - name: water (for soaking)
    amount: 1
    unit: l
instructions:
  - "Choose and rinse: Pick heavy, shiny chestnuts with no holes and nothing rattling inside. Drop them in water and discard any that float — they are usually dried out or spoiled inside. Rinse."
  - "Score: Hold each chestnut with a towel and cut a slit or cross about 2–3 mm deep and 2–3 cm long with a small sharp knife. It must go through the shell and thin brown skin so steam can escape, but not deep into the nut."
  - "Soak: Soak the scored chestnuts in water for 15–30 minutes, then pat dry. This keeps them softer and moister."
  - "Air fry: Air fry at 200 °C for about 18 minutes, shaking halfway (180 °C for 15 minutes keeps them moister). They are done when the cuts open wide and the flesh is golden and soft; give any firm ones 3–5 minutes more."
  - "Rest and peel: Wrap in a damp (not wet) kitchen towel for 5–10 minutes to steam them. Peel while still warm, removing the shell and the brown inner skin. Black spots on the surface or cut edge are just char; discard a nut only if it has dark, fuzzy or soft patches inside the flesh, or smells musty. For softer, market-style chestnuts, pressure cook them first (8–10 minutes on high with 250 ml water and a steamer rack), then air fry for just 3–5 minutes."
