title: Poori Masala (Potato Curry)
tags:
  - South Indian
  - Curry
  - Vegetarian
  - Pressure cooker
servings: 6
ingredients:
  - name: Waxy potatoes, diced into 2cm cubes
    amount: 600
    unit: g
  - name: Water (for cooking potatoes)
    amount: 240
    unit: ml
  - name: coconut oil or ghee
    amount: 30
    unit: g
  - name: Cumin seeds
    amount: 1.2
    unit: tsp
  - name: Mustard seeds
    amount: 0.7
    unit: tsp
  - name: Chana dal (split chickpeas), rinsed
    amount: 12
    unit: g
  - name: Urad dal (split black gram), rinsed
    amount: 12
    unit: g
  - name: Curry leaves (fresh if available), finely chopped
    amount: 8
    unit: g
  - name: Green chili (Indian or Thai), slit or finely diced
    amount: 2
    unit: ""
  - name: Fresh ginger, finely minced
    amount: 12
    unit: g
  - name: Onions, thinly sliced
    amount: 180
    unit: g
  - name: Ripe tomatoes, finely chopped (or canned without additives)
    amount: 150
    unit: g
  - name: Turmeric powder (organic)
    amount: 0.25
    unit: tsp
  - name: Sea salt (to taste)
    amount: 1
    unit: tsp
  - name: asafoetida (hing, optional)
    amount: 1
    unit: pinch
  - name: Water (to adjust consistency)
    amount: 150
    unit: ml
  - name: Fresh coriander leaves, chopped
    amount: 8
    unit: g
  - name: Fresh lemon juice (optional)
    amount: 0.5
    unit: tbsp
instructions:
  - "Prepare Potatoes: Wash Waxy potatoes thoroughly under running water. Peel and cut into Water cubes (about 2cm). Rinse Chana dal and Urad dal dals separately and set aside. Slice Onions thinly. Chop Ripe tomatoes and mince Fresh ginger."
  - "Pressure Cooker Method - Pressure Cook Potatoes: Add diced Waxy potatoes to pressure cooker with Water. Cook on medium flame for 1-2 whistles (about 8-10 minutes) until potatoes are soft and slightly mushy. Reserve the cooking liquid (potato stock). **Alternative**: If using regular pot, bring water to boil and simmer for 12-15 minutes until tender."
  - "Temper the Spices: Heat Coconut oil or ghee in a heavy-bottomed pan on medium heat. Add Mustard seeds and Cumin seeds. Let them crackle for 20-30 seconds until golden."
  - "Toast the Dals: Add Chana dal and Urad dal to the seeds. Stir constantly for 1-2 minutes until lentils turn golden and aromatic."
  - "Add Aromatics: When dals turn golden, add curry leaves and green chilies. Stir for 20-30 seconds until leaves turn crisp. Add a pinch of asafoetida if using."
  - "Sauté Onions and Ginger: Add Onions sliced onions and Fresh ginger. Sauté on medium heat for 3-4 minutes, stirring occasionally, until onions become transparent and lose the raw flavor."
  - "Add Tomatoes and Spices: Add Ripe tomatoes chopped tomatoes, Turmeric powder turmeric, and Sea salt. Stir well and cook for 4-5 minutes, stirring frequently, until tomatoes become completely mushy and break down. The raw smell should disappear."
  - "Combine with Potatoes: Add the cooked potatoes from step 2 along with the reserved potato stock. Gently mash about 1/3 of the potatoes with the back of a spoon to help thicken the curry, while keeping some potato cubes intact for texture."
  - "Adjust Consistency: If curry seems too thick, add Water warm water gradually until you reach a thick gravy-like consistency (not too thin, not too thick). The curry should coat the back of a spoon."
  - "Final Simmer: Cover and cook on low heat for 3-4 minutes, allowing flavors to meld. Stir occasionally. Taste and adjust salt if needed."
  - "Finish and Serve: Remove from heat. Sprinkle Fresh coriander leaves on top. Add Fresh lemon juice if desired (helps with iron absorption). Mix gently and serve hot with pooris, chapatis, or any flatbread."
