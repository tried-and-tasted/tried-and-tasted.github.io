title: Spätzle with Caramelised Onions and Egg
tags:
  - International
  - Pasta & Noodles
  - Vegetarian
servings: 1
ingredients:
  - name: egg spätzle (readymade)
    amount: 200
    unit: g
  - name: onion, thinly sliced
    amount: 100
    unit: g
  - name: eggs
    amount: 2
    unit: ""
  - name: butter
    amount: 20
    unit: g
  - name: salt
    amount: 0.5
    unit: tsp
  - name: black pepper
    amount: 0.25
    unit: tsp
  - name: fresh chives or parsley, chopped (garnish)
    amount: 10
    unit: g
instructions:
  - "Boil Spätzle (1 min) and dry: Bring a small pot of water to boil. Add a pinch of salt. Cook egg spätzle for exactly 1 minute. Drain and pat dry with kitchen paper — drier Spätzle fries better and gets crispier."
  - "Caramelise onions (8-10 min): Melt half of butter in a wide pan on medium heat. Add onion and cook 8–10 minutes stirring every 2–3 minutes until deep golden brown and slightly crispy at the edges. Don't rush — this is the flavour of the whole dish. Remove and set aside."
  - "Fry Spätzle in butter: Add remaining butter to the same pan on medium-high. Add drained egg spätzle. Spread in single layer and let sit undisturbed 2 minutes until slightly golden on the bottom. Toss and fry 1 more minute."
  - "Scramble eggs in the centre: Push Spätzle to the sides. Crack eggs into the centre. Scramble gently 30–40 seconds until just set but still slightly wet. Mix immediately into the Spätzle. Add salt and black pepper and toss together."
  - "Add onions back and serve: Scatter caramelised onions back over everything and toss gently — keep some visible on top. Taste and adjust salt. Scatter fresh chives or parsley on top. Serve immediately or cool and pack for later."
