title: Spanish Tortilla (Tortilla Española)
tags:
  - International
  - Main
  - Vegetarian
  - Air fryer
servings: 4
ingredients:
  - name: large eggs
    amount: 6
    unit: ""
  - name: potatoes, peeled & thinly sliced (2–3 mm)
    amount: 500
    unit: g
  - name: onion, thinly sliced
    amount: 150
    unit: g
  - name: olive oil (for slow-frying)
    amount: 110
    unit: g
  - name: salt
    amount: 1
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: olive oil (for final pan)
    amount: 14
    unit: g
instructions:
  - "Prep the potatoes: Peel and slice potatoes thinly (2–3 mm) — a mandoline or careful knife work is fine. Slice onion the same way. Sprinkle both with a pinch of salt and toss."
  - "Slow-fry potatoes & onion (the key step): Heat olive oil in a 22–24 cm non-stick pan on medium-low. Add potatoes and onion. They should gently sizzle — not fry hard. Cook for 20 minutes, turning occasionally with a spatula, until the potatoes are completely soft but not browned. This slow confit is what makes the tortilla creamy inside."
  - "Drain and mix with eggs: Drain the potato-onion mixture through a colander over a bowl — save the oil for future cooking! Let it cool for 3 minutes. Beat large eggs with remaining salt and black pepper in a large bowl. Add the drained potato mix into the eggs and press down gently so everything is coated."
  - "Cook the tortilla — first side: Add olive oil to the same pan on medium heat. Pour in the egg-potato mixture, spreading it evenly. Cook on medium-low for 5–6 minutes until the edges are set and only the very centre still looks slightly wobbly."
  - "Flip it (beginner tip included): Place a large flat plate (bigger than your pan) face-down over the pan. Hold firmly and flip in one confident move. Slide the tortilla back into the pan, uncooked side down. Cook for 3–4 more minutes. Beginners tip: if flipping feels scary, cover the pan with a lid and cook on low for 8 min instead — it won't be as round but tastes identical."
  - "Air fryer option (easier flip-free method): Instead of steps 4–5: grease a 20 cm oven-safe tin or silicone mould. Pour in the mixture. Air fry at 160°C for 18–20 minutes until set in the centre. No flipping needed at all."
  - "Rest and pack: Slide onto a plate and rest for 10 minutes before cutting — this is important for the texture to set. Slice into wedges like a cake. Pack in an airtight container. Keeps in the fridge for 3 days. Also good cold — no reheating needed."
