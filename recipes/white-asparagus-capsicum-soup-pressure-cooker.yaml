title: White Asparagus & Capsicum Soup (Pressure Cooker)
tags:
  - International
  - Soup
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: white asparagus, peeled — save ALL peels and ends
    amount: 500
    unit: g
  - name: capsicum mixed colours, roughly chopped
    amount: 300
    unit: g
  - name: carrot, roughly chopped
    amount: 200
    unit: g
  - name: tomato, roughly chopped
    amount: 150
    unit: g
  - name: onion, roughly chopped
    amount: 150
    unit: g
  - name: potato, roughly chopped (natural thickener)
    amount: 100
    unit: g
  - name: garlic cloves, crushed
    amount: 3
    unit: ""
  - name: water (reduced for pressure cooker — no evaporation)
    amount: 850
    unit: ml
  - name: butter or olive oil
    amount: 30
    unit: g
  - name: bay leaves
    amount: 2
    unit: ""
  - name: dried thyme
    amount: 1
    unit: tsp
  - name: salt
    amount: 1.5
    unit: tsp
  - name: black or white pepper
    amount: 0.5
    unit: tsp
  - name: lemon juice — added after blending
    amount: 15
    unit: ml
  - name: sugar — balances asparagus bitterness
    amount: 1
    unit: tsp
instructions:
  - "Peel asparagus, keep all peels: Peel white asparagus from just below the tip downward. Snap the woody bottom end off each spear — it breaks naturally at the right point. Save every peel and woody end — they go directly into the pressure cooker today, no separate broth step needed."
  - "Quick sauté in the pressure cooker (7 min): Open the pressure cooker and heat butter or olive oil on medium. Add onion and stir for 3–4 minutes until softened and translucent. Add garlic cloves and stir for 1 minute until fragrant. Add carrot and potato — the hardest vegetables — and stir for 2 minutes."
  - "Add everything including peels: Add white asparagus chopped into 3–4cm pieces, capsicum mixed colours, tomato, all asparagus peels and woody ends, bay leaves, dried thyme, salt and black or white pepper. Pour water over everything. Stir once to combine."
  - "Pressure cook (3 whistles): Close the pressure cooker lid. Cook on high until 3 whistles, then reduce to low for 3 minutes. Turn off and let pressure release naturally — about 8–10 minutes. Do not force open."
  - "Remove bay leaves and woody ends: Open the lid carefully. Remove bay leaves. The asparagus peels and woody ends have done their job — now fish out as many woody ends as possible with a spoon or tongs before blending. The fibrous woody ends don't blend smoothly."
  - "Blend directly in the pot: Use a stick blender directly in the pot and blend for at least 90 seconds until completely smooth. The potato and vegetables will create a naturally thick velvety texture. For an ultra-silky result, pass through a fine sieve pressing with a spoon — this also catches any remaining peel fibres."
  - "Add lemon, sugar and balance: Return to low heat if needed. Add lemon juice and sugar. Stir and taste carefully — adjust salt if needed, more lemon if it tastes flat. The soup should taste bright, slightly sweet and deeply savoury. If too thick add a small splash of hot water and stir."
  - "Serve, pack or freeze: Serve immediately or cool completely before portioning. Pack in a pre-warmed insulated container. Freeze in individual portions without any cream — reheats perfectly from frozen with a splash of water."
