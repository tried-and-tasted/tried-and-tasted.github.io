title: Sweet Kolukattai (Modak) with Raw Cane Sugar
tags:
  - South Indian
  - Sweet
  - Vegetarian
  - Pressure cooker
  - Air fryer
servings: 12
ingredients:
  - name: rice flour (idiyappam/kolukattai flour)
    amount: 250
    unit: g
  - name: water
    amount: 300
    unit: ml
  - name: salt
    amount: 0.25
    unit: tsp
  - name: coconut oil or ghee, for the dough
    amount: 5
    unit: g
  - name: fresh or frozen grated coconut (or rehydrated desiccated coconut)
    amount: 200
    unit: g
  - name: raw cane sugar
    amount: 140
    unit: g
  - name: cardamom powder
    amount: 0.5
    unit: tsp
  - name: ghee, for the filling
    amount: 14
    unit: g
instructions:
  - "Make the filling: In a pan over low-medium heat, add fresh or frozen grated coconut and raw cane sugar together and cook, stirring, for 4-6 minutes until the sugar melts and coats the coconut and the mixture thickens slightly. Stir in cardamom powder and ghee. Cool completely before filling."
  - "Boil water for dough: Bring water to a boil with salt and coconut oil or ghee in a pot (or the pressure cooker's inner pot)."
  - "Make the dough: Turn off heat, add rice flour all at once, stir quickly until it comes together into a shaggy mass. Cover and rest 5 minutes."
  - "Knead: While still warm, knead with lightly oiled hands until smooth and pliable. Add a teaspoon of hot water if it feels dry or cracks."
  - "Shape: Divide into small lemon-sized balls. Flatten each into a cup, add a spoon of cooled filling, then pleat and seal into a peak — or, for beginners, simply fold in half into an easy half-moon shape."
  - "Steam – pressure cooker method (fastest): Grease an idli plate or steamer basket and arrange the kolukattai. Place in the pressure cooker with 2 cups water in the base, but leave off the whistle/weight. Steam 10-12 minutes."
  - "Steam – regular steamer/idli pot (alternative): If you don't have a pressure cooker, steam in an idli pot or any steamer for 15 minutes."
  - "Air fryer option (alternative): Brush shaped kolukattai lightly with ghee and air fry at 160°C for 8-10 minutes. Texture will be slightly firmer/crisper than steamed."
