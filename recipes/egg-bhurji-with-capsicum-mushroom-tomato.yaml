title: Egg Bhurji with Capsicum, Mushroom & Tomato
tags:
  - North Indian
  - Breakfast
  - Vegetarian
servings: 2
ingredients:
  - name: eggs
    amount: 4
    unit: ""
  - name: capsicum, finely diced
    amount: 100
    unit: g
  - name: onion, finely diced
    amount: 100
    unit: g
  - name: tomato, finely chopped
    amount: 100
    unit: g
  - name: button mushrooms, finely diced
    amount: 80
    unit: g
  - name: garlic cloves, minced
    amount: 2
    unit: ""
  - name: fresh ginger, grated
    amount: 8
    unit: g
  - name: oil or ghee or butter
    amount: 18
    unit: g
  - name: cumin seeds
    amount: 0.5
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: coriander powder
    amount: 0.5
    unit: tsp
  - name: red chili powder (or mild paprika for less heat)
    amount: 0.5
    unit: tsp
  - name: garam masala
    amount: 0.25
    unit: tsp
  - name: salt
    amount: 0.75
    unit: tsp
  - name: black pepper
    amount: 0.25
    unit: tsp
  - name: lemon juice — added at the end
    amount: 10
    unit: ml
  - name: fresh coriander or parsley, chopped (garnish)
    amount: 15
    unit: g
instructions:
  - "Beat eggs and prep vegetables: Crack eggs into a bowl, add a pinch of salt and black pepper and beat well. Set aside. Finely dice all vegetables — the finer the chop the better they blend into the eggs."
  - "Golden onions (5-6 min — don't rush): Heat oil or ghee or butter in a pan on medium-high. Add cumin seeds and let sizzle 20 seconds. Add onion and cook for 5–6 minutes until golden brown — not just soft, properly golden. This is the flavour foundation."
  - "Build masala with tomato and mushroom: Add garlic cloves and fresh ginger, stir 1 minute. Add turmeric, coriander powder, red chili powder (or mild paprika for less heat) and remaining salt. Stir 30 seconds. Add tomato and cook 4–5 minutes until completely broken down and oil separates at edges. Add button mushrooms and stir fry 2 minutes until they release their water and start to brown."
  - "Add capsicum (keep some crunch): Add capsicum and stir fry on high heat for 2 minutes — keep some crunch, don't let it go completely soft."
  - "Add eggs — fold gently, remove while still wet: Reduce heat to medium-low. Pour beaten eggs over the vegetable masala. Let sit undisturbed for 30 seconds until edges just start to set. Then gently fold and stir in large slow movements — not fast scrambling. Add garam masala. Remove from heat while still slightly wet and glossy — residual heat finishes the cooking."
  - "Finish with lemon and serve: Add lemon juice and stir gently. Taste and adjust salt. Scatter fresh coriander or parsley on top. Serve immediately with chapati or toasted bread."
