title: South Indian Chicken Kolambu
tags:
  - South Indian
  - Curry
servings: 3
ingredients:
  - name: boneless chicken thigh, cut into chunks
    amount: 500
    unit: g
  - name: coconut oil (or neutral oil)
    amount: 30
    unit: g
  - name: mustard seeds
    amount: 1
    unit: tsp
  - name: dried red chillies
    amount: 2
    unit: piece
  - name: curry leaves
    amount: 15
    unit: piece
  - name: onion, finely chopped
    amount: 150
    unit: g
  - name: garlic, minced
    amount: 15
    unit: g
  - name: ginger, minced
    amount: 10
    unit: g
  - name: tomatoes, chopped
    amount: 200
    unit: g
  - name: water
    amount: 200
    unit: ml
  - name: turmeric powder
    amount: 0.5
    unit: tsp
  - name: red chilli powder
    amount: 1
    unit: tsp
  - name: coriander powder
    amount: 2
    unit: tsp
  - name: cumin powder
    amount: 1
    unit: tsp
  - name: black pepper powder
    amount: 0.5
    unit: tsp
  - name: garam masala
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1
    unit: tsp
  - name: fresh coriander, chopped (garnish)
    amount: 10
    unit: g
instructions:
  - "Marinate the chicken: Toss boneless chicken thigh with turmeric powder, red chilli powder, and half of salt. Set aside while you prep the other ingredients."
  - "Temper the spices: Heat coconut oil in a heavy pan or kadai over medium-high heat. Add mustard seeds and let them splutter. Add dried red chillies and curry leaves — fry for 20–30 seconds until fragrant."
  - "Sauté onion: Add onion and fry, stirring often, until deep golden brown — this is key for a dark, rich kolambu base."
  - "Add ginger, garlic & tomatoes: Add garlic and ginger, stir for 1 minute. Add tomatoes and cook until the tomatoes break down completely and oil separates from the mixture."
  - "Add ground spices: Lower heat to medium. Add coriander powder, cumin powder, black pepper powder, and remaining salt. Stir well and cook for 2 minutes, adding a splash of water if it sticks."
  - "Cook the chicken: Add the marinated boneless chicken thigh and stir to coat well. Cook on medium-high, turning occasionally, until the chicken is sealed and coated in the masala."
  - "Simmer: Pour in water, stir well, and bring to a boil. Reduce to a gentle simmer and cook uncovered until the gravy thickens and oil floats on top."
  - "Finish and serve: Stir in garam masala, taste and adjust salt. Garnish with fresh coriander. Serve hot with rice, idli, or dosa."
