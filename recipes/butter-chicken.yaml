instructions:
  - "Marinate: Cut the chicken into 4–5 cm chunks. Mix all marinade ingredients with the lemon juice and coat the chicken well. Cover and refrigerate for at least 2 hours, ideally 6–8 hours or overnight (no longer than 24 hours)."
  - "Char the chicken: Heat a pan on the highest flame until smoking hot and add a tiny splash of oil. Place the chicken in a single layer and cook 4–5 minutes without moving until charred underneath. Flip and cook another 4–5 minutes. It does not need to be cooked through yet. Set aside."
  - "Build the gravy base: In a heavy-bottomed pot, melt the butter with the oil on medium heat. Add the cardamom, cloves and bay leaf and sizzle 30 seconds. Add the onion and cook 8–10 minutes until deep golden. Add the ginger-garlic paste and fry 2 minutes until the raw smell is gone. Add the tomatoes and cashews and cook 10–12 minutes until completely mushy and the oil separates. Add the Kashmiri chilli, coriander, cumin and turmeric and cook 2 minutes."
  - "Blend and strain: Turn off the heat, remove the bay leaf and cool 5–10 minutes. Blend until completely smooth, then strain back into the pot, pressing firmly with a spoon. Discard the solids — this gives the silky restaurant texture."
  - "Simmer: Return to low heat, add the water to reach a medium consistency that coats a spoon, and simmer 5 minutes, stirring occasionally."
  - "Add cream and chicken: Turn the heat to the lowest setting and stir in the cooking cream. Never let it boil — 12% cream splits easily. Add the charred chicken, cover and simmer on the lowest heat for 8–10 minutes until cooked through (white inside, no pink, juices run clear). Add a splash of water if too thick."
  - "Finish: Stir in the finishing butter until melted. Crush the kasuri methi between your palms and sprinkle in. Add the final garam masala and sugar, taste and adjust salt. Serve hot with naan, roti or basmati rice."
