title: Spiced Chicken Chapathi Wrap
tags:
  - North Indian
  - Main
servings: 3
ingredients:
  - name: chicken thighs, boneless and skinless
    amount: 500
    unit: g
  - name: yogurt (marinade)
    amount: 85
    unit: g
  - name: Kashmiri red chilli powder
    amount: 1.5
    unit: tsp
  - name: garam masala
    amount: 0.75
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: cumin powder
    amount: 0.75
    unit: tsp
  - name: ginger-garlic paste
    amount: 1.5
    unit: tsp
  - name: oil
    amount: 10
    unit: g
  - name: lemon juice
    amount: 11
    unit: ml
  - name: salt
    amount: 0.75
    unit: tsp
  - name: yogurt (sauce)
    amount: 100
    unit: g
  - name: garlic clove, grated (sauce)
    amount: 1
    unit: ""
  - name: lemon juice (sauce)
    amount: 1
    unit: tsp
  - name: cumin powder (sauce)
    amount: 0.25
    unit: tsp
  - name: Kashmiri chilli powder (sauce)
    amount: 0.25
    unit: tsp
  - name: fresh coriander, finely chopped
    amount: 1
    unit: tbsp
  - name: salt (sauce)
    amount: 0.25
    unit: tsp
  - name: sugar (sauce)
    amount: 1
    unit: pinch
  - name: chapathis
    amount: 3
    unit: ""
  - name: raw onion and tomato, sliced (to fill)
    amount: 1
    unit: handful
instructions:
  - "Marinate: Cut the chicken into 4–5 cm chunks. Mix the marinade yogurt, Kashmiri chilli, garam masala, turmeric, cumin, ginger-garlic paste, oil, lemon juice and salt, and coat the chicken well. Cover and refrigerate at least 2 hours, ideally 6–8 hours or overnight (no longer than 24 hours). Short on time: make shallow cuts in the chicken first and marinate 30–45 minutes."
  - "Cook the chicken: Heat a pan on high heat with a tiny splash of oil. Cook the chicken in a single layer for about 10 minutes, turning once it is charred underneath, until cooked through — white inside with no pink, and juices run clear."
  - "Make the yogurt sauce: Mix the sauce yogurt, garlic, lemon juice, cumin, Kashmiri chilli, coriander, salt and sugar. Taste and adjust. Add 5 ml water if too thick."
  - "Assemble: Warm each chapathi on a dry pan for 30 seconds per side. Spread with the yogurt sauce, add the chicken, sliced onion and tomato, and roll tightly. A pinch of chaat masala over the chicken adds a tangy punch."
