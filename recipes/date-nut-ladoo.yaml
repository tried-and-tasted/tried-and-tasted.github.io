title: Date-Nut Ladoo
tags:
  - Indian
  - Sweet
  - Vegetarian
servings: 11
ingredients:
  - name: dates, pitted
    amount: 200
    unit: g
  - name: ground almonds (plain, not sweetened badam mix)
    amount: 80
    unit: g
  - name: pistachios, roughly chopped
    amount: 40
    unit: g
  - name: ghee
    amount: 5
    unit: g
  - name: cardamom powder
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 0.25
    unit: tsp
instructions:
  - "Soak the dates in hot water for 15 minutes, then drain well and pat dry. Firm dates (like Deglet Nour) need this, otherwise the paste stays crumbly."
  - "Dry-roast the ground almonds in a pan on low heat for 3 to 4 minutes, stirring, until fragrant. Let cool."
  - "Blend the dates and ghee in short bursts for 1 to 2 minutes, scraping down the sides, until a thick, sticky paste forms. Add 1 tbsp warm milk or soaking water if it is too stiff."
  - "Fold in the almonds, cardamom, salt and pistachios by hand."
  - "Roll into about 30 g ladoos. If the mix is too sticky, add a little more ground almonds."
  - "Chill for 30 to 60 minutes. Keeps about 1 week in the fridge."
