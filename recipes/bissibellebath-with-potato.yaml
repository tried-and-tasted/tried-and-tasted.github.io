title: Bissibellebath with Potato
tags:
  - South Indian
  - Rice
  - Vegetarian
  - Pressure cooker
servings: 3
ingredients:
  - name: rice (Ponni boiled or basmati)
    amount: 100
    unit: g
  - name: toor dal
    amount: 75
    unit: g
  - name: potato, diced 1.5cm
    amount: 150
    unit: g
  - name: carrot, diced 1.5cm
    amount: 100
    unit: g
  - name: french beans, sliced 2cm
    amount: 80
    unit: g
  - name: frozen summer vegetable mix (straight from freezer)
    amount: 100
    unit: g
  - name: frozen peas (straight from freezer)
    amount: 80
    unit: g
  - name: onion, finely diced
    amount: 100
    unit: g
  - name: tomato, finely chopped
    amount: 150
    unit: g
  - name: tamarind ball soaked in 100ml warm water, strained
    amount: 20
    unit: g
  - name: water (increased for potato absorption)
    amount: 980
    unit: ml
  - name: ghee (half for tadka, half for finishing)
    amount: 30
    unit: g
  - name: mustard seeds
    amount: 1
    unit: tsp
  - name: cumin seeds
    amount: 1
    unit: tsp
  - name: turmeric
    amount: 1
    unit: tsp
  - name: coriander powder
    amount: 1.5
    unit: tsp
  - name: cumin powder
    amount: 1
    unit: tsp
  - name: red chili powder (reduce for a milder dish)
    amount: 0.25
    unit: tsp
  - name: garam masala
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 1.5
    unit: tsp
  - name: black pepper (reduce for a milder dish)
    amount: 0.25
    unit: tsp
  - name: curry leaves (optional — Asian shop)
    amount: 8
    unit: g
  - name: dried red chili (optional)
    amount: 2
    unit: ""
  - name: fresh coriander, chopped (garnish)
    amount: 15
    unit: g
  - name: cashews (optional garnish)
    amount: 10
    unit: g
instructions:
  - "Soak tamarind and prep (10 min): Soak tamarind ball soaked in 100ml warm water tamarind in 100ml warm water for 10 minutes. Squeeze and press to dissolve pulp, strain through sieve, set liquid aside. Rinse rice and toor dal together under cold water once. Dice potato and carrot into 1.5cm cubes. Slice french beans into 2cm pieces."
  - "Tadka — mustard seeds first then onion: Heat half of ghee in pressure cooker on medium-high. Add mustard seeds — wait until they pop and splutter about 30 seconds. Add cumin seeds and sizzle 20 seconds. Add onion and cook 5–6 minutes until golden brown."
  - "Add tomato and spices: Add curry leaves and dried red chili if using — stir 20 seconds. Add tomato and cook 4–5 minutes until completely broken down and oil separates. Add turmeric, coriander powder, cumin powder, red chili powder, garam masala, salt and black pepper. Stir for 1 minute."
  - "Add rice, dal, all vegetables and tamarind water: Add rinsed rice and toor dal, potato, carrot, french beans, frozen summer vegetable mix and frozen peas straight from freezer. Pour strained tamarind water and water over everything. Stir well to combine."
  - "Pressure cook (5 whistles + 8 min low): Close pressure cooker lid. Cook on high until 5 whistles then reduce to low for 8 minutes. Turn off and let pressure release naturally — about 10 minutes. Do not force open."
  - "Check consistency: Open lid and stir well. Should be thick, slightly soupy and deeply coloured. Rice, dal and potato should be completely merged. If too thick add a splash of hot water. If too thin cook uncovered 2 minutes on medium."
  - "Finishing ghee tadka and serve: Heat remaining ghee in a small pan on high until shimmering. Pour directly over bissibellebath. Add fresh coriander and cashews if using. Stir gently and taste — adjust salt and tamarind if needed. Serve with plain yogurt on the side."
