title: Butter Chicken Fried Rice with Egg, Broccoli & Cauliflower
tags:
  - International
  - Rice
servings: 2
ingredients:
  - name: cooked rice (day old or cooled completely — Ponni or basmati)
    amount: 500
    unit: g
  - name: chicken with butter chicken marinade, grilled 8 min, sliced into bite-size pieces
    amount: 150
    unit: g
  - name: capsicum mixed colours, diced 1.5cm
    amount: 100
    unit: g
  - name: broccoli, cut into small florets
    amount: 80
    unit: g
  - name: cauliflower, cut into small florets
    amount: 80
    unit: g
  - name: spring onions — white part sliced, green part reserved for garnish
    amount: 3
    unit: ""
  - name: eggs
    amount: 2
    unit: ""
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: neutral oil or butter
    amount: 18
    unit: g
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: salt (taste first — the chicken marinade is already salty)
    amount: 0.5
    unit: tsp
  - name: fresh coriander, roughly chopped (garnish only)
    amount: 50
    unit: g
  - name: sesame oil (optional — finish only)
    amount: 5
    unit: g
instructions:
  - "Prep rice and chicken (important): Make sure cooked rice is completely cold — spread on a plate and refrigerate 30 minutes if freshly cooked. Break up any clumps with your fingers before cooking. Slice grilled chicken with butter chicken marinade into bite-size pieces and set aside. Separate spring onion white and green parts."
  - "Cauliflower first — 2 min head start: Heat pan on highest heat for 2 minutes until very hot — almost smoking. Add half of neutral oil or butter. Add cauliflower first — it is the hardest vegetable and needs 2 minutes head start. Let sit undisturbed 1 minute then toss."
  - "Stir fry capsicum and broccoli (3 min): Add capsicum mixed colours capsicum and broccoli to the same pan. Spread in single layer — do not stir for 2 minutes. Let edges char slightly. Toss and cook 1 more minute. Remove all vegetables from pan and set aside."
  - "Scramble eggs in the pan: Add remaining neutral oil or butter to the same hot pan. Add spring onion white parts and garlic cloves garlic — stir fry 30 seconds. Push to the side. Crack eggs into the empty space and scramble quickly for 30 seconds until just set — still slightly wet. Mix into the garlic and spring onion."
  - "Add rice and stir fry (2 min): Add cooked rice cold rice to the pan. Break up every clump immediately with spatula. Stir fry on highest heat for 2 minutes tossing continuously — every grain should separate and start to toast slightly."
  - "Add chicken and vegetables: Add black pepper and salt. Toss everything vigorously for 1 minute. Add the roasted vegetables and the chicken back in. Toss together for 1 more minute until everything is hot and well combined."
  - "Finish and serve: Turn heat off. Add sesame oil if using and toss once. Taste and adjust salt. Plate and top generously with fresh coriander and reserved spring onion green parts. Serve immediately."
