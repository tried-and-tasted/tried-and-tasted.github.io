title: Banana Protein Pancakes
tags:
  - International
  - Breakfast
  - Vegetarian
  - Air fryer
servings: 1
ingredients:
  - name: very ripe banana (medium, black-spotted)
    amount: 1
    unit: ""
  - name: egg (large)
    amount: 1
    unit: ""
  - name: Skyr or Greek yogurt (3.5% fat)
    amount: 60
    unit: g
  - name: oat flour (blend rolled oats fine)
    amount: 30
    unit: g
  - name: baking powder
    amount: 0.5
    unit: tsp
  - name: cinnamon
    amount: 0.25
    unit: tsp
  - name: vanilla extract or vanilla sugar
    amount: 0.5
    unit: tsp
  - name: pinch of salt
    amount: 1
    unit: ""
  - name: butter (for frying)
    amount: 5
    unit: g
instructions:
  - "Mash the banana: Mash very ripe banana in a bowl with a fork until completely smooth — no lumps at all. The blacker the banana, the sweeter the result. If your banana is not very ripe, microwave it for 30 seconds first."
  - "Mix wet ingredients: Add egg, Skyr or Greek yogurt, and vanilla extract or vanilla sugar to the mashed banana. Whisk well until the mixture is smooth and a little airy — about 30 seconds of brisk whisking helps make the pancakes fluffier."
  - "Add dry ingredients: Add oat flour, baking powder, cinnamon, and pinch of salt. Fold gently with a spoon — do not overmix. Stop as soon as no dry flour is visible. The batter should be pourable like a thick cream. If it is too thick, add 1 tsp of milk at a time."
  - "Rest the batter: Let the batter sit for 3 minutes. This lets the oat flour fully absorb moisture so the pancakes cook evenly and stay soft inside."
  - "Cook on low heat: Heat a non-stick pan on low-medium heat — lower than you think. Add butter and let it foam and settle. Pour batter into small rounds of about 7–8 cm. Cook until bubbles appear across the whole surface and edges look set, about 2–3 minutes. Flip once and cook 1 minute more. Do not press down."
  - "Air fryer option: Preheat air fryer to 170°C. Line with parchment. Spoon into small rounds. Air fry 5 min, flip gently, cook 2 more minutes. No oil needed."
