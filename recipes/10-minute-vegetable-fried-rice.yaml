title: 10-Minute Vegetable Fried Rice
tags:
  - International
  - Rice
  - Vegetarian
servings: 2
ingredients:
  - name: cooked white Ponni rice (your leftover)
    amount: 400
    unit: g
  - name: mixed vegetables, roughly chopped (whatever you have)
    amount: 250
    unit: g
  - name: onion, roughly chopped
    amount: 1
    unit: ""
  - name: garlic cloves, crushed (optional, skip if lazy)
    amount: 2
    unit: ""
  - name: eggs (optional but highly recommended — adds protein)
    amount: 2
    unit: ""
  - name: soy sauce
    amount: 30
    unit: ml
  - name: oil (any neutral oil or butter)
    amount: 18
    unit: g
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: salt (taste first — soy sauce is already salty)
    amount: 0.5
    unit: tsp
instructions:
  - "Hot pan — fry onion (2 min): Get your pan on the highest heat and let it get properly hot — 2 minutes. Add oil. Add onion and garlic cloves if using, stir for 2 minutes until the edges start to colour."
  - "Fry the vegetables (3 min): Add mixed vegetables and stir fry on high heat for 3 minutes. Don't cover — you want them to char slightly at the edges, not steam. Hard vegetables like carrots go first, soft ones like tomato or zucchini last."
  - "Scramble eggs in the pan (optional): If using eggs, push everything to the side of the pan, crack eggs into the empty space and scramble quickly for 30 seconds until just set, then mix into the vegetables."
  - "Add rice and soy sauce (2 min): Add cooked white Ponni rice and break up any clumps with the spatula. Stir fry everything together on high for 2 minutes. Add soy sauce, black pepper, and salt — toss everything well so the soy sauce coats every grain evenly."
  - "Done — eat or pack: Taste and adjust salt or soy sauce. Eat immediately or pack into a pre-warmed insulated container."
