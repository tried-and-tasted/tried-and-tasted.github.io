title: Pasta Carbonara (Authentic — No Cream)
tags:
  - International
  - Pasta & Noodles
servings: 4
ingredients:
  - name: spaghetti or rigatoni
    amount: 400
    unit: g
  - name: pancetta or smoked bacon cubes
    amount: 200
    unit: g
  - name: whole eggs
    amount: 2
    unit: ""
  - name: egg yolks (extra richness)
    amount: 4
    unit: ""
  - name: Parmesan or Grana Padano, finely grated
    amount: 80
    unit: g
  - name: black pepper, freshly ground (generous)
    amount: 2
    unit: tsp
  - name: salt (for pasta water)
    amount: 1
    unit: tbsp
  - name: reserved pasta cooking water
    amount: 150
    unit: ml
instructions:
  - "Make the egg sauce: In a bowl, whisk together whole eggs and egg yolks with Parmesan or Grana Padano and black pepper. Mix until it looks like a pale, thick cream. Set aside — this sauce is never heated directly, only by the pasta's residual heat."
  - "Boil pasta: Bring a large pot of water to a rolling boil. Add salt. Cook spaghetti or rigatoni according to packet instructions minus 1 minute — it should be al dente (firm to bite). Before draining, scoop out reserved pasta cooking water with a mug and set aside."
  - "Crisp the pancetta: While pasta cooks, fry pancetta or smoked bacon cubes in a dry pan (no oil needed) on medium-high heat for 4–5 minutes until golden and crispy at the edges. Turn off the heat and leave in the pan."
  - "Combine — the critical step: Drain pasta and immediately add it to the pan with the pancetta (heat OFF). Toss for 30 seconds to coat. Now wait 60 seconds — let it cool slightly so eggs won't scramble. Pour the egg-cheese mixture over the pasta and toss vigorously while adding pasta water a splash at a time until you get a glossy, creamy sauce. The residual heat cooks the eggs gently."
  - "Finish and pack: Plate and top with extra Parmesan or Grana Padano and black pepper. To pack: use an airtight container. To reheat, add 30 ml water into the container before microwaving 90 seconds — stir halfway — this brings back the creaminess."
