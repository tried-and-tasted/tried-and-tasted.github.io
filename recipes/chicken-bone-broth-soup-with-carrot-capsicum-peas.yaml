title: Chicken Bone Broth Soup with Carrot, Capsicum & Peas
tags:
  - International
  - Soup
  - Pressure cooker
servings: 4
ingredients:
  - name: chicken thigh bones (rinsed)
    amount: 50
    unit: g
  - name: potato, roughly chopped
    amount: 200
    unit: g
  - name: carrot, roughly chopped
    amount: 150
    unit: g
  - name: onion, roughly chopped
    amount: 150
    unit: g
  - name: tomato, roughly chopped
    amount: 150
    unit: g
  - name: frozen peas (straight from freezer)
    amount: 80
    unit: g
  - name: capsicum, roughly chopped
    amount: 100
    unit: g
  - name: garlic cloves, crushed
    amount: 3
    unit: ""
  - name: fresh ginger, sliced (optional)
    amount: 8
    unit: g
  - name: water
    amount: 660
    unit: ml
  - name: bay leaves
    amount: 2
    unit: ""
  - name: turmeric
    amount: 0.75
    unit: tsp
  - name: coriander powder
    amount: 0.5
    unit: tsp
  - name: cumin powder
    amount: 0.5
    unit: tsp
  - name: black pepper
    amount: 0.25
    unit: tsp
  - name: salt
    amount: 1.25
    unit: tsp
  - name: ghee — added after blending
    amount: 20
    unit: g
  - name: lemon juice — added after blending
    amount: 10
    unit: ml
instructions:
  - "Rinse bones and rough chop (3 min): Rinse chicken thigh bones under cold water. Roughly chop potato, carrot, capsicum, onion and tomato — no need to be neat, everything gets blended. Crush garlic cloves and slice fresh ginger if using. Frozen peas go in straight from the freezer."
  - "Dump everything in — no frying needed: Add everything directly into the pressure cooker — chicken thigh bones, potato, carrot, onion, tomato, capsicum, frozen peas straight from freezer, garlic cloves, fresh ginger, bay leaves, turmeric, coriander powder, cumin powder, black pepper and salt. Pour water over everything. Stir once. No frying, no oil."
  - "Pressure cook (4 whistles + 10 min low): Close pressure cooker lid. Cook on high until 4 whistles then reduce to low for 10 minutes. Turn off and let pressure release naturally — about 10 minutes. Do not force open."
  - "Remove ALL bones carefully — critical step: Open lid carefully. Remove bay leaves. Carefully fish out every single bone using tongs or slotted spoon. Go slowly — check thoroughly for small bone fragments. This is critical before the stabmixer goes in. Any tiny chicken flesh from the bones stays in the soup."
  - "Blend with stabmixer — head fully submerged: Insert stabmixer fully into the pot before switching on. Keep head fully submerged at all times — switch on only when submerged, switch off before lifting out. Blend for 90 seconds until completely smooth and velvety. The carrot, capsicum and potato create a naturally thick, bright orange soup."
  - "Stir in ghee and lemon — taste and serve: Add ghee directly into hot blended soup and stir vigorously 10 seconds until fully emulsified. Add lemon juice and stir. Taste and adjust salt. If too thick add a small splash of hot water and stir. Serve immediately or cool and portion for fridge or freezer."
