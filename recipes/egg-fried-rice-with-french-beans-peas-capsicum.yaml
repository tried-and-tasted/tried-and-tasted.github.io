title: Egg Fried Rice with French Beans, Peas & Capsicum
tags:
  - International
  - Rice
  - Vegetarian
servings: 2
ingredients:
  - name: cooked leftover rice (cold, broken up)
    amount: 400
    unit: g
  - name: capsicum mixed colours, diced 1.5cm
    amount: 100
    unit: g
  - name: french beans, sliced diagonally 1.5cm
    amount: 80
    unit: g
  - name: frozen peas (straight from freezer)
    amount: 80
    unit: g
  - name: onion, finely diced
    amount: 80
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: eggs
    amount: 2
    unit: ""
  - name: neutral oil or butter
    amount: 18
    unit: g
  - name: soy sauce
    amount: 20
    unit: ml
  - name: lemon juice — added at the end
    amount: 10
    unit: ml
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: salt — taste first before adding, soy sauce is already salty
    amount: 0.5
    unit: tsp
  - name: red chili flakes (optional)
    amount: 0.25
    unit: tsp
  - name: spring onion or fresh coriander, chopped (garnish)
    amount: 15
    unit: g
instructions:
  - "Prep rice and vegetables (3 min): Break up any clumps in cooked leftover rice with your fingers — every grain should be separate before it hits the pan. Slice french beans diagonally at 1.5cm. Dice capsicum mixed colours and onion. Mince garlic cloves. Keep frozen peas in the freezer until needed."
  - "Fry onion and french beans first (5 min): Heat pan on highest heat for 2 minutes until very hot. Add neutral oil or butter. Add onion and garlic cloves garlic — stir fry 2 minutes until golden at the edges. Add french beans — they need 3 minutes, harder than the other vegetables. Stir fry on high heat undisturbed for 1 minute then toss."
  - "Add capsicum and peas (2 min): Add capsicum mixed colours capsicum and frozen peas straight from freezer. Stir fry on high heat for 2 minutes — keep capsicum slightly crunchy. Push everything to the sides of the pan."
  - "Scramble eggs in the centre: Crack eggs into the empty centre of the pan. Scramble quickly for 30 seconds until just set but still slightly wet. Mix into the vegetables immediately."
  - "Add rice and stir fry (2 min): Add cooked leftover rice cold rice to the pan. Break up any remaining clumps immediately with spatula. Stir fry on highest heat tossing continuously for 2 minutes until every grain separates and starts to toast slightly."
  - "Soy sauce around the edges — not on rice: Pour soy sauce around the edges of the pan — not directly on rice. It sizzles and coats everything evenly. Add black pepper and red chili flakes if using. Toss vigorously for 1 minute. Taste before adding salt — soy sauce is already very salty."
  - "Finish with lemon and pack: Turn heat off. Add lemon juice and toss once. Taste and adjust. Scatter spring onion or fresh coriander on top. Pack immediately in pre-warmed insulated container or cool slightly before packing in an airtight box."
