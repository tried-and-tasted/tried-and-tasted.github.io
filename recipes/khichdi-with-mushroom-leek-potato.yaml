title: Khichdi with Mushroom, Leek & Potato
tags:
  - Indian
  - Rice
  - Vegetarian
  - Pressure cooker
servings: 1
ingredients:
  - name: Ponni boiled rice (uncooked)
    amount: 100
    unit: g
  - name: toor dal (uncooked)
    amount: 52
    unit: g
  - name: tomato, roughly chopped
    amount: 96
    unit: g
  - name: onion, roughly chopped
    amount: 56
    unit: g
  - name: button mushrooms, quartered
    amount: 3
    unit: ""
  - name: leek stem (15cm), sliced into rounds
    amount: 1
    unit: ""
  - name: potato, diced 2cm
    amount: 100
    unit: g
  - name: zucchini, roughly chopped
    amount: 80
    unit: g
  - name: frozen broccoli florets (straight from freezer)
    amount: 50
    unit: g
  - name: water
    amount: 545
    unit: ml
  - name: ghee or butter
    amount: 25
    unit: g
  - name: cumin seeds
    amount: 1.25
    unit: tsp
  - name: turmeric
    amount: 0.5
    unit: tsp
  - name: salt (slightly generous — flavour fades in container)
    amount: 1
    unit: tsp
  - name: black pepper
    amount: 0.5
    unit: tsp
  - name: lemon juice, squeezed just before closing container
    amount: 1
    unit: tsp
instructions:
  - "Rinse and chop (3 min): Rinse Ponni boiled rice and toor dal together under cold water once. Roughly chop tomato and onion. Quarter button mushrooms. Slice leek stem into rounds. Dice potato into 2cm cubes. Roughly chop the zucchini. frozen broccoli florets goes in straight from the freezer — no thawing."
  - "Dump everything in: Add everything into the pressure cooker — Ponni boiled rice, toor dal, tomato, onion, button mushrooms, leek stem, potato, zucchini, frozen broccoli florets straight from freezer, water, turmeric, salt and black pepper. Stir once to combine."
  - "Pressure cook (5 whistles): Close the lid. Cook on high until 5 whistles, then reduce to low for 5 minutes. Turn off and let pressure release naturally — about 10 minutes. Do not force open."
  - "Pre-warm insulated container: While pressure releases, fill insulated container with boiling water from kettle. Close lid, pre-warm for 2 minutes, empty just before filling."
  - "Darker tadka: Heat ghee or butter in a small pan on high until shimmering. Add cumin seeds and let them go almost brown — about 30–40 seconds, darker than just popping. Pour immediately over khichdi and stir in well."
  - "Check consistency and seasoning: Stir khichdi well and check consistency — should look slightly more liquid than eating consistency as it thickens while sitting. Too thick, add a splash of hot water. Too thin, stir on low heat uncovered for 2 minutes. Taste and adjust salt."
  - "Lemon in, pack and go: Empty pre-warming water from container. Fill with hot khichdi. Squeeze lemon juice directly in and stir. Close tightly and go. Stays warm and flavourful for 4–5 hours."
