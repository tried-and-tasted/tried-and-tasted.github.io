title: Tamil Nadu Meen Kuzhambu (Cod Fish)
tags:
  - South Indian
  - Curry
servings: 2
ingredients:
  - name: cod fish fillet, cut into 6–7 cm chunks
    amount: 250
    unit: g
  - name: tamarind block (imli)
    amount: 20
    unit: g
  - name: hot water for soaking tamarind
    amount: 150
    unit: ml
  - name: onion, finely chopped
    amount: 100
    unit: g
  - name: tomatoes, finely chopped
    amount: 150
    unit: g
  - name: ginger garlic paste
    amount: 15
    unit: g
  - name: green chilli, slit
    amount: 1
    unit: ""
  - name: sesame oil (nallennai) or vegetable oil
    amount: 25
    unit: g
  - name: mustard seeds
    amount: 0.5
    unit: tsp
  - name: fenugreek seeds (methi)
    amount: 0.25
    unit: tsp
  - name: dried red chillies
    amount: 2
    unit: ""
  - name: curry leaves
    amount: 8
    unit: ""
  - name: turmeric powder — for marinade
    amount: 0.5
    unit: tsp
  - name: turmeric powder — for masala
    amount: 0.5
    unit: tsp
  - name: Kashmiri chilli powder — for marinade
    amount: 0.75
    unit: tsp
  - name: Kashmiri chilli powder — for masala
    amount: 1.25
    unit: tsp
  - name: coriander powder
    amount: 1.5
    unit: tsp
  - name: cumin powder
    amount: 0.75
    unit: tsp
  - name: black pepper powder
    amount: 0.5
    unit: tsp
  - name: salt
    amount: 0.75
    unit: tsp
  - name: water for gravy
    amount: 80
    unit: ml
  - name: fresh coriander leaves, chopped — to garnish
    amount: 8
    unit: g
instructions:
  - "Soak the tamarind: Soak tamarind block in hot water for soaking tamarind for 15 minutes. Squeeze and strain well to get a thick tamarind water. Discard the pulp and seeds."
  - "Dry & marinate the cod: Pat the cod fish very dry with kitchen paper — important for the marinade to stick and to keep the gravy from thinning. Coat evenly with turmeric powder, Kashmiri chilli powder, and a pinch of salt. Set aside for 10 minutes."
  - "Temper the spices: Heat sesame oil or vegetable oil in a wide heavy-bottomed pan on medium-high. Add mustard seeds and let them splutter. Add fenugreek seeds — fry 15 seconds until lightly golden, don't burn or it turns bitter. Add dried red chillies and curry leaves, fry 20 seconds."
  - "Cook the onions: Add onion and green chilli. Fry on medium heat for 10–12 minutes, stirring often, until deep golden brown. Don't rush — this is the flavour foundation."
  - "Add ginger garlic paste & masala spices: Add ginger garlic paste and fry for 2 minutes until the raw smell disappears. Then add turmeric powder, Kashmiri chilli powder, coriander powder, cumin powder, and black pepper powder. Stir on medium heat for 1 minute until fragrant."
  - "Cook the tomatoes: Add tomatoes and cook on medium heat for 8–10 minutes, mashing as they soften, until oil separates from the masala and the mixture looks thick and jammy."
  - "Add tamarind water & simmer: Pour in the strained tamarind water and water for gravy. Add salt to taste. Bring to a boil, then simmer uncovered on medium-low for 12–15 minutes until the gravy is thick and the raw tamarind smell mellows into a deep tang."
  - "Add cod & cook gently: Turn heat to LOW. Gently place the cod chunks in a single layer in the gravy — don't crowd them. Spoon hot gravy over each piece. Cover with a tight-fitting lid and cook on LOW for 5–7 minutes. Do NOT stir or shake — cod breaks apart very easily. Check at 5 minutes by gently pressing with a spoon — it should flake easily but still hold its shape."
  - "Rest & garnish: Turn off heat immediately once done. Rest uncovered for 3–4 minutes — residual heat finishes the fish perfectly without overcooking. Garnish with fresh coriander leaves. Serve with steamed rice."
