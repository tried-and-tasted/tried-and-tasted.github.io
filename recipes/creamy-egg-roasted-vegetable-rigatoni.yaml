title: Creamy Egg & Roasted Vegetable Rigatoni
tags:
  - International
  - Pasta & Noodles
  - Vegetarian
servings: 2
ingredients:
  - name: rigatoni-style pipe pasta (Barilla)
    amount: 150
    unit: g
  - name: capsicum mixed colours, diced 2cm
    amount: 120
    unit: g
  - name: carrot, diced 1.5cm
    amount: 120
    unit: g
  - name: potato, diced 1.5cm
    amount: 120
    unit: g
  - name: tomato, finely chopped
    amount: 120
    unit: g
  - name: onion, finely diced
    amount: 80
    unit: g
  - name: garlic cloves, minced
    amount: 3
    unit: ""
  - name: eggs
    amount: 3
    unit: ""
  - name: Parmesan or young Gouda, finely grated
    amount: 30
    unit: g
  - name: spring onion stalks, finely sliced (garnish)
    amount: 3
    unit: ""
  - name: olive oil or neutral oil (for roasting)
    amount: 18
    unit: g
  - name: olive oil or butter (for sauce)
    amount: 14
    unit: g
  - name: pasta cooking water (reserve before draining)
    amount: 90
    unit: ml
  - name: dried oregano
    amount: 1
    unit: tsp
  - name: salt for pasta water
    amount: 0.75
    unit: tbsp
  - name: salt for sauce
    amount: 0.75
    unit: tsp
  - name: black pepper (skip or reduce for a milder portion)
    amount: 0.25
    unit: tsp
instructions:
  - "Boil pasta — reserve cooking water: Bring a pot of water to boil. Add salt for pasta water. Cook rigatoni-style pipe pasta per packet instructions minus 1 minute — firm to bite. Before draining scoop out pasta cooking water with a mug and set aside. Drain and set pasta aside. This runs in parallel with vegetable roasting."
  - "Whisk egg sauce (no chili): In a small bowl whisk together eggs, Parmesan or young Gouda and a pinch of black pepper. Set aside at room temperature — never add cold eggs to very hot pasta. No chili flakes in the egg mix — keeps it mild."
  - "Stovetop roast — potato first (2 min): Heat a heavy pan on high heat for 1 minute until very hot. Add a few drops of olive oil or neutral oil. Add potato first — potato needs 2 minutes head start. Let sit undisturbed 2 minutes until golden on one side. Stir and push to the side."
  - "Add capsicum and carrot (5 min): Add capsicum mixed colours and carrot to the same hot pan. Spread in a single layer. Let sit undisturbed on high heat for 2–3 minutes until edges char slightly. Toss and cook another 2–3 minutes until golden and just tender. Remove everything from pan and set aside."
  - "Build tomato sauce in same pan: Reduce heat to medium. Add olive oil or butter to same pan. Add onion and cook 3 minutes until soft. Add garlic cloves and stir 1 minute. Add tomato and dried oregano, cook 4 minutes until tomato breaks down into a rough sauce. Add roasted vegetables back and stir together."
  - "Combine — heat OFF before adding eggs: Add drained pasta and toss well. Turn heat OFF completely. Wait 60 seconds. Pour egg mixture over pasta and toss vigorously while adding pasta water a splash at a time until glossy and creamy. Residual heat cooks eggs gently — if heat is on they scramble."
  - "Plate and serve: For a milder portion, add extra cheese on top and no extra pepper. For more heat, add extra black pepper and generous spring onion. Scatter spring onion stalks on both. Serve immediately."
