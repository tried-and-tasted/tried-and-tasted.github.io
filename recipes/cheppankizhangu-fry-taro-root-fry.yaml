title: Cheppankizhangu Fry (Taro Root Fry)
tags:
  - South Indian
  - Side
  - Vegetarian
  - Pressure cooker
servings: 4
ingredients:
  - name: baby taro root (cheppankizhangu), peeled
    amount: 600
    unit: g
  - name: sesame oil (nallennai)
    amount: 36
    unit: g
  - name: mustard seeds
    amount: 1.25
    unit: tsp
  - name: urad dal (split black gram)
    amount: 1.25
    unit: tsp
  - name: curry leaves
    amount: 12
    unit: piece
  - name: dried red chillies
    amount: 3
    unit: piece
  - name: red chilli powder
    amount: 1.25
    unit: tsp
  - name: coriander powder
    amount: 1.25
    unit: tsp
  - name: turmeric powder
    amount: 0.5
    unit: tsp
  - name: rice flour (or cornflour)
    amount: 18
    unit: g
  - name: salt
    amount: 1.25
    unit: tsp
  - name: asafoetida (hing)
    amount: 0.25
    unit: tsp
instructions:
  - "Pressure cook the taro: Place 600g peeled taro in the pressure cooker with 180g water. Cook on medium-high for 2 whistles (about 5–6 minutes) — thick pieces need 3–4. A fork should go through to the centre; if only the edges are soft, give it 1 more whistle. Let pressure release naturally for 5 minutes. Drain and let steam escape for 1–2 minutes so the surface dries out well."
  - "Coat with spices: In a bowl, combine 1¼ tsp red chilli powder, 1¼ tsp coriander powder, ½ tsp turmeric powder, 18g rice flour or cornflour, and 1¼ tsp salt. Add the drained taro and toss well until evenly coated."
  - "Temper the oil: Heat 36g sesame oil in a wide non-stick or iron pan over medium heat. Add 1¼ tsp mustard seeds and let them splutter. Add 1¼ tsp urad dal, 3 dried red chillies, and 12 curry leaves — sauté for 30 seconds until the dal turns golden. Add ¼ tsp asafoetida (hing) and stir."
  - "Fry the taro: Add the spice-coated taro to the pan in a single layer. Fry in two batches if your pan is small. Do not stir immediately — let it sit for 3–4 minutes to form a crust. Flip and fry the other sides until all around golden and crispy."
  - "Serve: Serve hot as a side dish with steamed rice and sambar or rasam."
